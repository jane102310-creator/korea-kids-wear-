<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitleText">韓國童裝連線代購</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #5A4D41;
      --text-sub: #8C705F;
      --accent: #8C705F;
      --accent-light: #F4EBE1;
      --border-color: #EFECE6;
      --shadow: 0 4px 16px rgba(90, 77, 65, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 120px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    .header { background: var(--card-bg); padding: 18px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 16px; text-align: center; border: 1px solid var(--border-color); }
    .header-title h1 { font-size: 20px; font-weight: 700; color: var(--text-main); }

    .member-top-bar { background: var(--card-bg); padding: 12px 16px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .member-info { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .btn-login-open { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }

    .page-section { display: none; }
    .page-section.active { display: block; }

    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); transition: all 0.2s; }
    .filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .item-card:hover { transform: translateY(-3px); }
    .item-img-wrap { width: 100%; height: 160px; background: #F4EBE1; position: relative; }
    .item-img { width: 100%; height: 100%; object-fit: cover; }
    .item-content { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .item-name { font-size: 14px; font-weight: 600; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 500; }
    .tag-category { background-color: var(--accent-light); color: var(--text-sub); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; box-shadow: 0 -4px 12px rgba(90,77,65,0.05); }
    .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); cursor: pointer; gap: 3px; flex: 1; position: relative; }
    .nav-item.active { color: var(--accent); font-weight: bold; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .cart-badge { position: absolute; top: 2px; right: 25%; background: #D9534F; color: white; font-size: 9px; padding: 1px 5px; border-radius: 10px; font-weight: bold; display: none; }

    .admin-nav { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-tab-btn { flex: 1; min-width: 30%; padding: 8px 2px; border: none; background: #EFECE6; color: var(--text-sub); font-weight: 600; border-radius: 10px; cursor: pointer; font-size: 11px; text-align: center; }
    .admin-tab-btn.active { background: var(--accent); color: white; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-item-row { background: #FAFAFA; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; position: relative; }
    .admin-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
    .admin-item-info { flex: 1; min-width: 0; }
    .admin-item-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; display: flex; justify-content: space-between; }
    
    .progress-box { background: #FFF; border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; margin: 6px 0; font-size: 12px; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .progress-controls { display: flex; align-items: center; gap: 6px; }
    .btn-mini-qty { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; font-weight: bold; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-main); }

    .customer-card { background: #FAFAFA; border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; margin-bottom: 12px; }
    .customer-name { font-size: 15px; font-weight: bold; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }

    .admin-action-btns { display: flex; gap: 6px; margin-top: 8px; }
    .btn-edit-prod { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-del-prod { background: #D9534F; color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-complete-order { background: #28A745; color: white; border: none; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-edit-order { background: var(--accent); color: white; border: none; padding: 2px 8px; font-size: 11px; border-radius: 6px; cursor: pointer; }
    .btn-submit { width: 100%; background-color: var(--accent); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-google { width: 100%; background-color: #DB4437; color: white; border: none; padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-save-manual { width: 100%; background-color: #28A745; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; margin-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
    .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; background: #FAFAFA; outline: none; color: var(--text-main); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title"><h1 id="headerTitleDisplay">韓國童裝連線代購</h1></div>
    </div>

    <!-- 會員狀態/登入橫幅 -->
    <div class="member-top-bar" id="memberTopBar">
      <div class="member-info" id="memberInfoDisplay">👤 尚未登入（請先登入或註冊會員）</div>
      <button class="btn-login-open" id="memberAuthBtn" onclick="openAuthModal()">會員登入 / 註冊</button>
    </div>
    
    <!-- 1. 首頁分頁 -->
    <div id="sectionHome" class="page-section active">
      <div class="filter-bar" id="filterBar">
        <button class="filter-pill active" onclick="setCategoryFilter('全部', this)">全部商品</button>
        <button class="filter-pill" onclick="setCategoryFilter('上衣/T恤', this)">上衣/T恤</button>
        <button class="filter-pill" onclick="setCategoryFilter('褲子/裙裝', this)">褲子/裙裝</button>
        <button class="filter-pill" onclick="setCategoryFilter('外套/針織', this)">外套/針織</button>
        <button class="filter-pill" onclick="setCategoryFilter('配件/鞋帽', this)">配件/鞋帽</button>
      </div>
      <div class="item-grid" id="itemListHome"></div>
    </div>

    <!-- 2. 分類分頁 -->
    <div id="sectionCategory" class="page-section">
      <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">📂 童裝分類瀏覽</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
        <button onclick="goToCategory('上衣/T恤')" class="filter-pill" style="padding: 20px; text-align: center; font-size: 15px;">👕 上衣/T恤</button>
        <button onclick="goToCategory('褲子/裙裝')" class="filter-pill" style="padding: 20px; text-align: center; font-size: 15px;">👖 褲子/裙裝</button>
        <button onclick="goToCategory('外套/針織')" class="filter-pill" style="padding: 20px; text-align: center; font-size: 15px;">🧥 外套/針織</button>
        <button onclick="goToCategory('配件/鞋帽')" class="filter-pill" style="padding: 20px; text-align: center; font-size: 15px;">🧢 配件/鞋帽</button>
      </div>
    </div>

    <!-- 3. 購物車分頁 -->
    <div id="sectionCart" class="page-section">
      <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px; color: var(--accent);">🛒 我的購物車</div>
      <div id="cartContentList"></div>
      <div id="cartCheckoutArea" style="display:none; margin-top: 16px;">
        <button class="btn-submit" onclick="submitCartOrder()">📦 確認送出訂單</button>
      </div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchSection('home', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首頁</span>
    </button>
    <button class="nav-item" onclick="switchSection('category', this)">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>分類</span>
    </button>
    <button class="nav-item" onclick="switchSection('cart', this)">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>購物車</span>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
    <button class="nav-item" onclick="openAdminPortal()">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>管理者</span>
    </button>
  </nav>

  <!-- 會員登入 / 註冊彈跳視窗 Modal -->
  <div class="modal-overlay" id="authModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(90,77,65,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1400;">
    <div class="modal-content" style="background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="authModalTitle" style="font-size: 18px; font-weight: 700;">🔐 會員登入 / 註冊</h2>
        <button class="btn-close" onclick="closeModal('authModal')" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✕</button>
      </div>
      
      <div id="registerFieldsGroup" style="display: none;">
        <div class="form-group">
          <label class="form-label">全名 (真實姓名) *</label>
          <input type="text" id="authFullName" class="form-input" placeholder="請輸入您的全名..." />
        </div>
        <div class="form-group">
          <label class="form-label">電話號碼 *</label>
          <input type="tel" id="authPhone" class="form-input" placeholder="0912345678" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">電子信箱 (Email) *</label>
        <input type="email" id="authEmail" class="form-input" placeholder="name@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label">密碼 *</label>
        <input type="password" id="authPassword" class="form-input" placeholder="請輸入密碼 (至少6碼)" />
      </div>

      <button class="btn-submit" id="authSubmitBtn" onclick="handleEmailAuth()">登入帳號</button>
      <button class="btn-google" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.8 5 12 5zm6.6 7c0-.4 0-.8-.1-1.2H12v2.4h3.7c-.2 1-.8 1.9-1.7 2.5l2.7 2.1c1.6-1.5 2.7-3.7 2.7-6.3zM12 23c3.2 0 6-1.1 8-3l-2.7-2.1c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.3-6.7-5.3L1.5 16.5C3.4 20.3 7.4 23 12 23z"/></svg>
        使用 Google 帳號快速登入
      </button>

      <div style="text-align: center; margin-top: 16px; font-size: 13px;">
        <span id="authToggleText" style="color: #666;">還沒有帳號？</span>
        <a href="javascript:void(0);" onclick="toggleAuthMode()" style="color: var(--accent); font-weight: bold; text-decoration: none; margin-left: 6px;" id="authToggleBtn">點此註冊新會員</a>
      </div>
    </div>
  </div>

  <!-- 點擊商品彈出的詳細選購 Modal -->
  <div class="modal-overlay" id="productDetailModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(90,77,65,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1300;">
    <div class="modal-content" style="background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 700;">👕 選擇尺寸與數量</h2>
        <button class="btn-close" onclick="closeModal('productDetailModal')" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✕</button>
      </div>
      <div style="text-align: center; margin-bottom: 16px;">
        <img id="detailModalImg" src="" alt="商品大圖" style="width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px; background: #F4EBE1;" />
      </div>
      <div style="margin-bottom: 8px;">
        <span id="detailModalCategory" class="tag tag-category" style="font-size: 12px; padding: 4px 10px;"></span>
      </div>
      <div id="detailModalName" style="font-size: 18px; font-weight: bold; color: var(--text-main); margin-bottom: 6px;"></div>
      <div id="detailModalNote" style="font-size: 13px; color: #666; margin-bottom: 16px; background: #FAFAFA; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color);"></div>
      
      <div style="font-size: 14px; font-weight: bold; color: var(--accent); margin-bottom: 8px;">📏 請選擇尺寸與數量：</div>
      <div id="detailModalSizeControls" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>

      <button class="btn-submit" onclick="addToCartModal()">🛒 放入購物車</button>
    </div>
  </div>

  <!-- 修改訂單數量 Modal -->
  <div class="modal-overlay" id="editOrderModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(90,77,65,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1200;">
    <div class="modal-content" style="background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 18px; font-weight: 700;">修改訂單尺寸/數量</h2>
        <button class="btn-close" onclick="closeModal('editOrderModal')" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✕</button>
      </div>
      <div class="form-group"><label class="form-label">買家姓名 / 電話</label><input type="text" id="modalEditBuyerName" class="form-input" readonly style="background:#eee;" /></div>
      <div class="form-group"><label class="form-label">童裝款式</label><input type="text" id="modalEditItemName" class="form-input" readonly style="background:#eee;" /></div>
      <div class="form-group">
        <label class="form-label">數量與尺寸/規格</label>
        <div style="display: flex; gap: 8px;">
          <input type="number" id="modalEditCountInput" class="form-input" min="0" style="flex: 2;" placeholder="填入0可刪除" />
          <select id="modalEditUnitSelect" class="form-select" style="flex: 1;"></select>
        </div>
      </div>
      <button class="btn-submit" onclick="saveAdminEditOrder()">儲存修改</button>
    </div>
  </div>

  <!-- 修改商品資料 Modal -->
  <div class="modal-overlay" id="editProdModal" style="z-index: 1100; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(90,77,65,0.4); display: none; justify-content: center; align-items: flex-end;">
    <div class="modal-content" style="background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><h2 style="font-size: 18px; font-weight: 700;">✏️ 編輯童裝資料</h2><button class="btn-close" onclick="closeEditProdModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✕</button></div>
      <div class="form-group"><label class="form-label">款式名稱 *</label><input type="text" id="editProdName" class="form-input" /></div>
      <div class="form-group"><label class="form-label">分類</label>
        <select id="editProdCategory" class="form-select">
          <option value="上衣/T恤">上衣/T恤</option>
          <option value="褲子/裙裝">褲子/裙裝</option>
          <option value="外套/針織">外套/針織</option>
          <option value="配件/鞋帽">配件/鞋帽</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">尺寸選項（用逗號隔開，例如 90,100,110,120,130）</label><input type="text" id="editProdUnits" class="form-input" /></div>
      <div class="form-group">
        <label class="form-label">商品圖片</label>
        <input type="file" id="editProdImageFile" class="form-input" accept="image/*" onchange="handleImageUpload(this, 'editProdImage')" style="margin-bottom: 6px;" />
        <input type="text" id="editProdImage" class="form-input" placeholder="上傳或貼上圖片網址..." />
      </div>
      <div class="form-group"><label class="form-label">備註說明 (顏色、材質等)</label><input type="text" id="editProdNote" class="form-input" /></div>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: #FAFAFA; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color);">
        <input type="checkbox" id="editProdHidden" style="width: 20px; height: 20px; cursor: pointer;" />
        <label for="editProdHidden" class="form-label" style="margin-bottom: 0; cursor: pointer;">隱藏此款式（暫不上架）</label>
      </div>
      <button class="btn-submit" onclick="saveEditProd()">儲存修改</button>
    </div>
  </div>

  <!-- 管理者登入 Modal -->
  <div class="modal-overlay" id="loginModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(90,77,65,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1000;">
    <div class="modal-content" style="background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><h2 style="font-size: 18px; font-weight: 700;">🔐 管理者登入</h2><button class="btn-close" onclick="closeModal('loginModal')" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✕</button></div>
      <div class="form-group">
        <label class="form-label">請輸入後台密碼</label>

  <script>
    // -----------------------------------------------------------------
    // 1. Firebase 初始化設定
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBHmyi3-dmv2Zcn8ULXwuIIODSWVdcDTdY",
      authDomain: "korea-buy-list.firebaseapp.com",
      projectId: "korea-buy-list",
      storageBucket: "korea-buy-list.firebasestorage.app",
      messagingSenderId: "131856493166",
      appId: "1:131856493166:web:1f4a1c108ffbfdb89a547f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    var currentMemberInfo = { name: "", phone: "" };
    var isRegisterMode = false;
    var cartItems = [];

    // 監聽 Firebase Auth 登入狀態
    auth.onAuthStateChanged(user => {
      var infoDisplay = document.getElementById('memberInfoDisplay');
      var authBtn = document.getElementById('memberAuthBtn');
      
      if (user) {
        var metadata = user.reloadUserInfo || {};
        var displayName = user.displayName || metadata.displayName || user.email.split('@')[0];
        // 嘗試從 user 儲存的 metadata 或 custom attributes 抓取電話，若無則預設
        var phone = metadata.phoneNumber || user.phoneNumber || "未填寫";
        currentMemberInfo = { name: displayName, phone: phone };

        infoDisplay.innerHTML = '👤 已登入：<b>' + currentMemberInfo.name + '</b> (' + currentMemberInfo.phone + ')';
        authBtn.innerText = '登出';
        authBtn.setAttribute('onclick', 'handleLogout()');
        authBtn.style.background = '#D9534F';
      } else {
        currentMemberInfo = { name: "", phone: "" };
        infoDisplay.innerHTML = '👤 尚未登入（請先登入或註冊會員）';
        authBtn.innerText = '會員登入 / 註冊';
        authBtn.setAttribute('onclick', 'openAuthModal()');
        authBtn.style.background = 'var(--accent)';
      }
    });

    function openAuthModal() {
      isRegisterMode = false;
      document.getElementById('authModalTitle').innerText = '🔐 會員登入';
      document.getElementById('registerFieldsGroup').style.display = 'none';
      document.getElementById('authSubmitBtn').innerText = '登入帳號';
      document.getElementById('authToggleText').innerText = '還沒有帳號？';
      document.getElementById('authToggleBtn').innerText = '點此註冊新會員';
      document.getElementById('authModal').style.display = 'flex';
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        document.getElementById('authModalTitle').innerText = '📝 註冊新會員';
        document.getElementById('registerFieldsGroup').style.display = 'block';
        document.getElementById('authSubmitBtn').innerText = '確認註冊';
        document.getElementById('authToggleText').innerText = '已經有帳號了？';
        document.getElementById('authToggleBtn').innerText = '點此登入';
      } else {
        document.getElementById('authModalTitle').innerText = '🔐 會員登入';
        document.getElementById('registerFieldsGroup').style.display = 'none';
        document.getElementById('authSubmitBtn').innerText = '登入帳號';
        document.getElementById('authToggleText').innerText = '還沒有帳號？';
        document.getElementById('authToggleBtn').innerText = '點此註冊新會員';
      }
    }

    function handleEmailAuth() {
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      var fullName = document.getElementById('authFullName').value.trim();
      var phone = document.getElementById('authPhone').value.trim();

      if (!email || !password) { alert('請填寫完整 Email 與密碼！'); return; }

      if (isRegisterMode) {
        if (!fullName || !phone) { alert('註冊會員必須填寫「全名」與「電話號碼」！'); return; }
        auth.createUserWithEmailAndPassword(email, password)
          .then(result => {
            return result.user.updateProfile({ displayName: fullName + " (" + phone + ")" });
          })
          .then(() => {
            alert('🎉 註冊成功並已登入！');
            closeModal('authModal');
            location.reload();
          })
          .catch(error => { alert('註冊失敗： ' + error.message); });
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            alert('✅ 登入成功！');
            closeModal('authModal');
          })
          .catch(error => { alert('登入失敗： ' + error.message); });
      }
    }

    function handleGoogleLogin() {
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          alert('🎉 Google 登入成功！');
          closeModal('authModal');
        })
        .catch(error => { alert('Google 登入失敗： ' + error.message); });
    }

    function handleLogout() {
      auth.signOut().then(() => {
        alert('已成功登出！');
      });
    }

    function handleImageUpload(inputElement, targetInputId) {
      var file = inputElement.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("⚠️ 圖片大小不能超過 2MB！");
        inputElement.value = "";
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetInputId).value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // -----------------------------------------------------------------
    // 2. 預設童裝資料
    // -----------------------------------------------------------------
    var defaultProducts = [
      { "id": 1, "name": "正韓小熊刷毛大學T", "prices": {}, "buyers": [], "category": "上衣/T恤", "units": ["90", "100", "110", "120", "130"], "note": "版型正常，材質超舒服", "image": "", "purchasedCounts": {}, "isCompleted": false, "isHidden": false },
      { "id": 2, "name": "彈性休閒內搭褲", "prices": {}, "buyers": [], "category": "褲子/裙裝", "units": ["90", "100", "110", "120", "130"], "note": "超好搭，彈性極佳", "image": "", "purchasedCounts": {}, "isCompleted": false, "isHidden": false }
    ];

    var products = defaultProducts;
    var completedOrders = [];
    var editingProdIndex = null;
    var editingOrderInfo = null;
    var currentModalItemIdx = null;
    var modalCartUnits = {};
    var isAuthed = false;
    var currentCategoryFilter = 'default_all';

    var ADMIN_PASSWORD = localStorage.getItem('korea_kids_pwd') || '1010520';
    var SITE_TITLE = localStorage.getItem('korea_kids_title') || '韓國童裝連線代購';
    var GLOBAL_EXCHANGE_RATE = parseFloat(localStorage.getItem('korea_kids_rate')) || 41.5;

    document.getElementById('pageTitleText').innerText = SITE_TITLE;
    document.getElementById('headerTitleDisplay').innerText = SITE_TITLE;
    document.getElementById('siteTitleInput').value = SITE_TITLE;
    document.getElementById('exchangeRateInput').value = GLOBAL_EXCHANGE_RATE;

    window.onload = function() {
      initRealtimeListener();
    };

    function getUnitPricing(p, unitKey) {
      if (!p.prices) p.prices = {};
      if (!p.prices[unitKey]) {
        p.prices[unitKey] = { krwPrice: '', rate: GLOBAL_EXCHANGE_RATE, ntPrice: '' };
      }
      var info = p.prices[unitKey];
      var krw = parseInt((info.krwPrice || '').replace(/,/g, '')) || 0;
      var rate = parseFloat(info.rate) || GLOBAL_EXCHANGE_RATE;
      var manualNt = parseInt((info.ntPrice || '').replace(/,/g, ''));
      
      var calculatedNt = (!isNaN(manualNt) && manualNt > 0) ? manualNt : (krw > 0 && rate > 0 ? Math.round(krw / rate) : 0);
      return { krwPrice: info.krwPrice || '', rate: rate, ntPrice: info.ntPrice || '', finalNt: calculatedNt };
    }

    function initRealtimeListener() {
      db.collection('storeData').doc('kidsStoreDoc').onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            products = data.items;
          } else {
            products = defaultProducts;
            manualSaveData(false);
          }

          if (data && Array.isArray(data.completedOrders)) completedOrders = data.completedOrders;
          if (data && data.siteTitle) {
            SITE_TITLE = data.siteTitle;
            document.getElementById('pageTitleText').innerText = SITE_TITLE;
            document.getElementById('headerTitleDisplay').innerText = SITE_TITLE;
          }
          if (data && data.exchangeRate) {
            GLOBAL_EXCHANGE_RATE = data.exchangeRate;
            document.getElementById('exchangeRateInput').value = GLOBAL_EXCHANGE_RATE;
          }
        } else {
          products = defaultProducts;
          completedOrders = [];
          manualSaveData(false);
        }

        renderList();
        renderCartView();

        if (document.getElementById('adminModal').style.display === 'flex') {
          if (document.activeElement && document.activeElement.classList.contains('stats-input')) {
            // 輸入中不刷新
          } else {
            updateAdminProductList();
            updateAdminStats();
            updateDailyRevenueStats();
            updateCustomerStats();
            updateCompletedOrdersStats();
          }
        }
      }, err => {
        console.error("Listener error:", err);
      });
    }

    function manualSaveData(showAlert) {
      if (showAlert === undefined) showAlert = true;
      db.collection('storeData').doc('kidsStoreDoc').set({
        items: products,
        completedOrders: completedOrders,
        siteTitle: SITE_TITLE,
        exchangeRate: GLOBAL_EXCHANGE_RATE,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        if (showAlert) alert('✅ 資料已成功同步儲存至雲端！');
      }).catch(err => {
        alert('儲存至雲端失敗：' + err.message);
      });
    }

    function saveExchangeRate() {
      var rate = parseFloat(document.getElementById('exchangeRateInput').value);
      if (isNaN(rate) || rate <= 0) { alert('請輸入有效數值！'); return; }
      GLOBAL_EXCHANGE_RATE = rate;
      localStorage.setItem('korea_kids_rate', rate);
      manualSaveData(false);
      alert('✅ 匯率已更新！');
    }

    function updateUnitPricingInput(itemIdx, unitKey, field, val, inputElement) {
      var p = products[itemIdx];
      if (!p.prices) p.prices = {};
      if (!p.prices[unitKey]) {
        p.prices[unitKey] = { krwPrice: '', rate: GLOBAL_EXCHANGE_RATE, ntPrice: '' };
      }
      p.prices[unitKey][field] = val;
      manualSaveData(false);
    }

    function exportToExcel() {
      var csvContent = "\uFEFF訂單編號,買家姓名,款式名稱,分類,尺寸,數量,韓幣買入(₩),匯率,售價台幣(NT$),總售價,已採購數\n";
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (!p.buyers) p.buyers = [];
        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j]; var u = b.unit || '100';
          var pricing = getUnitPricing(p, u);
          var totalNtSum = pricing.finalNt * b.count;
          csvContent += ['"' + (b.orderId || '一般登記') + '"', '"' + b.name + '"', '"' + p.name + '"', '"' + p.category + '"', u, b.count, pricing.krwPrice, pricing.rate, pricing.finalNt, totalNtSum, p.purchasedCounts?.[u] || 0].join(",") + "\n";
        }
      }
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "韓國童裝訂單統計_" + new Date().toISOString().slice(0, 10) + ".csv");
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function switchSection(sectionName, btnElement) {
      document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      if (sectionName === 'home') { document.getElementById('sectionHome').classList.add('active'); renderList(); }
      else if (sectionName === 'category') { document.getElementById('sectionCategory').classList.add('active'); }
      else if (sectionName === 'cart') { document.getElementById('sectionCart').classList.add('active'); renderCartView(); }
    }

    function goToCategory(catName) {
      currentCategoryFilter = catName;
      switchSection('home', document.querySelectorAll('.bottom-nav .nav-item')[0]);
      document.querySelectorAll('.filter-pill').forEach(p => { if (p.innerText.includes(catName)) p.click(); });
    }

    function saveSiteTitle() {
      var newTitle = document.getElementById('siteTitleInput').value.trim();
      if (!newTitle) return;
      SITE_TITLE = newTitle;
      document.getElementById('pageTitleText').innerText = newTitle;
      document.getElementById('headerTitleDisplay').innerText = newTitle;
      manualSaveData(false);
      alert('標題已更新！');
    }

    function setCategoryFilter(category, btnElement) {
      currentCategoryFilter = category;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderList();
    }

    function fixImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('freeimage.host/i/')) {
        return 'https://iili.io/' + url.split('/i/').pop() + '.jpg';
      }
      return url;
    }

    function openProductDetailModal(itemIdx) {
      currentModalItemIdx = itemIdx;
      modalCartUnits = {};
      var p = products[itemIdx];
      var defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
      
      document.getElementById('detailModalImg').src = p.image ? fixImageUrl(p.image) : defaultSvg;
      document.getElementById('detailModalCategory').innerText = p.category || '童裝';
      document.getElementById('detailModalName').innerText = p.name;
      
      var noteEl = document.getElementById('detailModalNote');
      if (p.note) { noteEl.innerText = p.note; noteEl.style.display = 'block'; } else { noteEl.style.display = 'none'; }

      var sizeControlsEl = document.getElementById('detailModalSizeControls');
      sizeControlsEl.innerHTML = '';
      var units = p.units && p.units.length > 0 ? p.units : ['90', '100', '110', '120', '130'];

      for (var u = 0; u < units.length; u++) {
        var unitName = units[u];
        var row = document.createElement('div');
        row.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#FAFAFA; padding:8px 12px; border-radius:10px; border:1px solid var(--border-color);";
        row.innerHTML = '<span style="font-size:14px; font-weight:600;">尺寸 ' + unitName + '</span>' +
          '<div style="display:flex; align-items:center; gap:8px;">' +
            '<button class="btn-mini-qty" onclick="adjustModalQty(\'' + unitName + '\', -1)">-</button>' +
            '<span class="qty-display-mini" id="modal_qty_' + unitName + '">0</span>' +
            '<button class="btn-mini-qty" onclick="adjustModalQty(\'' + unitName + '\', 1)">+</button>' +
          '</div>';
        sizeControlsEl.appendChild(row);
      }

      document.getElementById('productDetailModal').style.display = 'flex';
    }

    function adjustModalQty(unitName, delta) {
      var current = modalCartUnits[unitName] || 0;
      var next = current + delta;
      if (next < 0) next = 0;
      
      if (next === 0) {
        delete modalCartUnits[unitName];
      } else {
        modalCartUnits[unitName] = next;
      }
      var displayEl = document.getElementById('modal_qty_' + unitName);
      if (displayEl) displayEl.innerText = next;
    }

    function addToCartModal() {
      if (!currentMemberInfo.name) { alert('請先登入會員才能將商品放入購物車！'); openAuthModal(); return; }

      var unitNames = Object.keys(modalCartUnits);
      if (unitNames.length === 0) { alert('請至少選擇一個尺寸的數量！'); return; }

      var p = products[currentModalItemIdx];
      
      for (var i = 0; i < unitNames.length; i++) {
        var uName = unitNames[i];
        var qty = modalCartUnits[uName];
        if (qty > 0) {
          cartItems.push({
            itemIdx: currentModalItemIdx,
            name: p.name,
            unit: uName,
            count: qty,
            image: p.image || ''
          });
        }
      }

      updateCartBadge();
      closeModal('productDetailModal');
      alert('🛒 已成功放入購物車！');
    }

    function updateCartBadge() {
      var badge = document.getElementById('cartBadge');
      if (cartItems.length > 0) {
        badge.innerText = cartItems.length;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderCartView() {
      var container = document.getElementById('cartContentList');
      var checkoutArea = document.getElementById('cartCheckoutArea');
      if (!container) return;
      container.innerHTML = '';

      if (cartItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#999; padding:30px;">購物車目前空空如也～趕快去挑選童裝吧！</div>';
        checkoutArea.style.display = 'none';
        return;
      }

      checkoutArea.style.display = 'block';
      for (var i = 0; i < cartItems.length; i++) {
        var c = cartItems[i];
        var card = document.createElement('div');
        card.className = 'customer-card';
        card.innerHTML = '<div class="customer-name"><span>👕 ' + c.name + '</span>' +
          '<button class="btn-del-prod" style="padding:2px 8px; font-size:11px;" onclick="removeFromCart(' + i + ')">移除</button></div>' +
          '<div style="font-size:13px; color:var(--text-sub);">尺寸：<b>' + c.unit + '</b> | 數量：<b>' + c.count + ' 件</b></div>';
        container.appendChild(card);
      }
    }

    function removeFromCart(index) {
      cartItems.splice(index, 1);
      updateCartBadge();
      renderCartView();
    }

    function submitCartOrder() {
      if (!currentMemberInfo.name) { alert('請先登入會員！'); openAuthModal(); return; }
      if (cartItems.length === 0) { alert('購物車是空的！'); return; }

      var orderId = 'ORD' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 90 + 10);

      for (var i = 0; i < cartItems.length; i++) {
        var c = cartItems[i];
        var p = products[c.itemIdx];
        if (!p.buyers) p.buyers = [];
        p.buyers.push({
          orderId: orderId,
          name: currentMemberInfo.name + " (" + currentMemberInfo.phone + ")",
          count: c.count,
          unit: c.unit,
          bought: 0
        });
      }

      cartItems = [];
      updateCartBadge();
      manualSaveData(false);
      switchSection('home', document.querySelectorAll('.bottom-nav .nav-item')[0]);
      alert('🎉 訂單已成功送出！系統已自動為您產生訂單編號：' + orderId);
    }

    function renderList() {
      var itemList = document.getElementById('itemListHome');
      if (!itemList) return;
      itemList.innerHTML = '';

      for (var i = 0; i < products.length; i++) {
        var product = products[i];
        if (product.isHidden) continue;

        if (currentCategoryFilter !== '全部' && currentCategoryFilter !== 'default_all' && product.category !== currentCategoryFilter) {
          continue;
        }

        var card = document.createElement('div');
        card.className = 'item-card';
        card.setAttribute('onclick', 'openProductDetailModal(' + i + ')');

        var defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        var imgSrc = product.image ? fixImageUrl(product.image) : defaultSvg;

        card.innerHTML = '<div class="item-img-wrap"><img src="' + imgSrc + '" class="item-img" alt="" /></div>' +
          '<div class="item-content">' +
            '<div class="item-name">' + product.name + '</div>' +
            '<div class="item-tags"><span class="tag tag-category">' + product.category + '</span></div>' +
          '</div>';
        
        itemList.appendChild(card);
      }
    }

    function openAdminPortal() {
      if (isAuthed) {
        updateAdminProductList(); updateAdminStats(); updateDailyRevenueStats(); updateCustomerStats(); updateCompletedOrdersStats();
        document.getElementById('adminModal').style.display = 'flex';
      } else {
        document.getElementById('adminPwdInput').value = '';
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    function submitLogin() {
      var pwd = document.getElementById('adminPwdInput').value;
      if (pwd === ADMIN_PASSWORD) {
        isAuthed = true;
        closeModal('loginModal');
        updateAdminProductList(); updateAdminStats(); updateDailyRevenueStats(); updateCustomerStats(); updateCompletedOrdersStats();
        document.getElementById('adminModal').style.display = 'flex';
      } else { alert('密碼錯誤！'); }
    }

    function saveNewPassword() {
      var oldP = document.getElementById('oldPwd').value;
      var newP = document.getElementById('newPwd').value;
      var confirmP = document.getElementById('confirmPwd').value;
      if (oldP !== ADMIN_PASSWORD) { alert('目前密碼錯誤！'); return; }
      if (!newP || newP !== confirmP) { alert('新密碼不一致！'); return; }
      ADMIN_PASSWORD = newP;
      localStorage.setItem('korea_kids_pwd', newP);
      alert('密碼修改成功！');
      document.getElementById('oldPwd').value = ''; document.getElementById('newPwd').value = ''; document.getElementById('confirmPwd').value = '';
    }

    function openAdminEditOrderModal(itemIdx, buyerName, unitName, currentCount) {
      editingOrderInfo = { itemIdx: itemIdx, buyerName: buyerName, oldUnit: unitName };
      var p = products[itemIdx];
      document.getElementById('modalEditBuyerName').value = buyerName;
      document.getElementById('modalEditItemName').value = p.name;
      document.getElementById('modalEditCountInput').value = currentCount;

      var unitSelect = document.getElementById('modalEditUnitSelect');
      unitSelect.innerHTML = '';
      var units = p.units && p.units.length > 0 ? p.units : ['100'];
      for (var i = 0; i < units.length; i++) {
        var opt = document.createElement('option');
        opt.value = units[i]; opt.innerText = units[i];
        if (units[i] === unitName) opt.selected = true;
        unitSelect.appendChild(opt);
      }
      document.getElementById('editOrderModal').style.display = 'flex';
    }

    function saveAdminEditOrder() {
      if (!editingOrderInfo) return;
      var newCount = parseInt(document.getElementById('modalEditCountInput').value);
      var newUnit = document.getElementById('modalEditUnitSelect').value;
      if (isNaN(newCount) || newCount < 0) { alert('請輸入有效數量！'); return; }

      var p = products[editingOrderInfo.itemIdx];
      if (!p || !p.buyers) return;

      if (newCount === 0) {
        p.buyers = p.buyers.filter(b => !(b.name.trim() === editingOrderInfo.buyerName.trim() && (b.unit || '100') === editingOrderInfo.oldUnit));
      } else {
        var found = false;
        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j];
          if (b.name.trim() === editingOrderInfo.buyerName.trim() && (b.unit || '100') === editingOrderInfo.oldUnit) {
            b.count = newCount; b.unit = newUnit; found = true; break;
          }
        }
        if (!found) p.buyers.push({ name: editingOrderInfo.buyerName, count: newCount, unit: newUnit, bought: 0 });
      }

      renderList(); updateCustomerStats(); updateAdminProductList(); updateAdminStats();
      manualSaveData(false); closeModal('editOrderModal');
      alert('✅ 訂單尺寸與數量已更新！');
    }

    function completeCustomerOrders(orderId) {
      if (confirm('🎉 確定將訂單編號 「' + orderId + '」 標記為「已完成」？')) {
        var itemsToComplete = [];
        var buyerName = '';
        products.forEach(p => {
          if (p.buyers) {
            var matching = p.buyers.filter(b => (b.orderId || '一般登記') === orderId);
            matching.forEach(b => {
              buyerName = b.name;
              var pricing = getUnitPricing(p, b.unit || '100');
              itemsToComplete.push({ itemName: p.name, count: b.count, unit: b.unit || '100', ntPrice: pricing.finalNt, krwPrice: pricing.krwPrice, rate: pricing.rate });
            });
            p.buyers = p.buyers.filter(b => (b.orderId || '一般登記') !== orderId);
          }
        });
        if (itemsToComplete.length > 0) {
          completedOrders.unshift({ id: Date.now(), orderId: orderId, buyerName: buyerName, items: itemsToComplete, completedAt: new Date().toLocaleString() });
        }
        renderList(); updateCustomerStats(); updateCompletedOrdersStats(); updateDailyRevenueStats(); updateAdminProductList(); updateAdminStats();
        manualSaveData(false);
        alert('✅ 訂單已完成並移至已完成分頁！');
      }
    }

    function restoreCompletedOrder(index) {
      if (confirm('確定恢復為未完成？')) {
        var comp = completedOrders[index];
        if (comp && comp.items) {
          comp.items.forEach(it => {
            var prod = products.find(p => p.name.trim() === it.itemName.trim());
            if (prod) { if (!prod.buyers) prod.buyers = []; prod.buyers.push({ orderId: comp.orderId || ('RESTORE-' + Date.now()), name: comp.buyerName, count: it.count, unit: it.unit, bought: 0 }); }
          });
        }
        completedOrders.splice(index, 1);
        renderList(); updateCustomerStats(); updateCompletedOrdersStats(); updateDailyRevenueStats(); updateAdminProductList(); updateAdminStats();
        manualSaveData(false);
      }
    }

    function deleteCompletedOrder(index) {
      if (confirm('確定永久刪除此歷史紀錄？')) { completedOrders.splice(index, 1); updateCompletedOrdersStats(); updateDailyRevenueStats(); manualSaveData(false); }
    }

    function adminDeleteOrder(orderId) {
      if (confirm('⚠️ 確定刪除訂單編號 ' + orderId + ' 的所有登記？')) {
        products.forEach(p => { if (p.buyers) p.buyers = p.buyers.filter(b => (b.orderId || '一般登記') !== orderId); });
        renderList(); updateCustomerStats(); updateAdminProductList(); updateAdminStats(); manualSaveData(false);
      }
    }

    function deleteItemFromAdmin(i) {
      if (confirm('確定徹底刪除此童裝款式？')) { products.splice(i, 1); renderList(); updateAdminProductList(); updateAdminStats(); updateCustomerStats(); manualSaveData(false); }
    }

    function updatePurchasedQty(itemIdx, unit, delta) {
      var p = products[itemIdx];
      if (!p.purchasedCounts) p.purchasedCounts = {};
      p.purchasedCounts[unit] = Math.max(0, (p.purchasedCounts[unit] || 0) + delta);
      renderList(); updateAdminStats(); manualSaveData(false);
    }

    function updateDailyRevenueStats() {
      var container = document.getElementById('dailyRevenueContentList');
      if (!container) return; container.innerHTML = '';
      if (completedOrders.length === 0) { container.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">尚無已完成的營收紀錄</div>'; return; }

      var dailyMap = {};
      completedOrders.forEach(comp => {
        var dateStr = (comp.completedAt || '').split(' ')[0] || '未分類';
        if (!dailyMap[dateStr]) dailyMap[dateStr] = { totalRevenue: 0, totalKrwCost: 0, totalNtCost: 0, orders: [] };
        var rev = 0, krwCost = 0, ntCost = 0;
        if (comp.items) {
          comp.items.forEach(it => {
            rev += (parseInt(it.ntPrice) || 0) * it.count;
            var kVal = parseInt((it.krwPrice || '').replace(/,/g, '')) || 0;
            krwCost += kVal * it.count;
            var rate = parseFloat(it.rate) || GLOBAL_EXCHANGE_RATE;
            ntCost += (kVal > 0 && rate > 0 ? Math.round(kVal / rate) : 0) * it.count;
          });
        }
        dailyMap[dateStr].totalRevenue += rev;
        dailyMap[dateStr].totalKrwCost += krwCost;
        dailyMap[dateStr].totalNtCost += ntCost;
        dailyMap[dateStr].orders.push(comp);
      });

      var dates = Object.keys(dailyMap).sort().reverse();
      var header = document.createElement('div');
      header.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color);";
      header.innerText = '💰 每日營收與毛利統計';
      container.appendChild(header);

      dates.forEach(d => {
        var day = dailyMap[d]; var profit = day.totalRevenue - day.totalNtCost;
        var card = document.createElement('div');
        card.className = 'customer-card'; card.style.background = '#FFFFFF';
        card.innerHTML = '<div style="font-size:15px; font-weight:bold; color:var(--accent); margin-bottom:8px; display:flex; justify-content:space-between;"><span>📅 ' + d + '</span><span style="color:#28A745;">營收 NT$ ' + day.totalRevenue.toLocaleString() + '</span></div>' +
          '<div style="font-size:13px; background:#FAFAFA; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-bottom:10px;">' +
            '<div>🛒 韓幣總成本：<b>₩ ' + day.totalKrwCost.toLocaleString() + '</b></div>' +
            '<div>💸 台幣總成本：<b>NT$ ' + day.totalNtCost.toLocaleString() + '</b></div>' +
            '<div>📈 預估毛利：<b style="color:' + (profit >= 0 ? '#28A745' : '#D9534F') + ';">NT$ ' + profit.toLocaleString() + '</b></div>' +
          '</div>';
        container.appendChild(card);
      });
    }

    function updateCustomerStats() {
      var customerList = document.getElementById('customerContentList');
      if (!customerList) return; customerList.innerHTML = '';
      var orderMap = {};

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (!p.buyers) continue;
        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j];
          var oId = b.orderId || '一般登記';
          if (!orderMap[oId]) { orderMap[oId] = { buyerName: b.name, items: [] }; }
          var pricing = getUnitPricing(p, b.unit || '100');
          orderMap[oId].items.push({ itemIdx: i, itemName: p.name, count: b.count, unit: b.unit || '100', ntPrice: pricing.finalNt });
        }
      }

      var orderIds = Object.keys(orderMap);
      if (orderIds.length === 0) { customerList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">🎉 目前沒有未完成的訂單！</div>'; return; }

      var header = document.createElement('div');
      header.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color);";
      header.innerText = '👥 未完成訂單數：' + orderIds.length + ' 筆';
      customerList.appendChild(header);

      for (var k = 0; k < orderIds.length; k++) {
        var oId = orderIds[k];
        var orderData = orderMap[oId];
        var card = document.createElement('div'); card.className = 'customer-card';
        var itemsHtml = ''; var totalNt = 0;

        for (var m = 0; m < orderData.items.length; m++) {
          var it = orderData.items[m]; totalNt += it.ntPrice * it.count;
          itemsHtml += '<div style="font-size:13px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">' +
            '<span>• ' + it.itemName + ' (尺寸 ' + it.unit + '): <b>' + it.count + ' 件</b></span>' +
            '<div style="display:flex; gap:4px;"><button class="btn-edit-order" onclick="openAdminEditOrderModal(' + it.itemIdx + ', \'' + orderData.buyerName + '\', \'' + it.unit + '\', ' + it.count + ')">修改</button></div></div>';
        }

        card.innerHTML = '<div class="customer-name"><span>📦 訂單編號：' + oId + ' <small style="color:#666;">(' + orderData.buyerName + ')</small></span>' +
          '<div style="display:flex; gap:6px;"><button class="btn-complete-order" onclick="completeCustomerOrders(\'' + oId + '\')">✅ 完成訂單</button>' +
          '<button class="btn-del-prod" style="padding:3px 8px; font-size:11px;" onclick="adminDeleteOrder(\'' + oId + '\')">🗑️ 刪除</button></div></div>' +
          itemsHtml + '<div style="margin-top:8px; padding-top:6px; border-top:1px dashed var(--border-color); font-size:13px; color:var(--accent);">💰 總計金額：<b>NT$ ' + totalNt.toLocaleString() + '</b></div>';
        customerList.appendChild(card);
      }
    }

    function updateCompletedOrdersStats() {
      var compList = document.getElementById('completedOrdersContentList');
      if (!compList) return; compList.innerHTML = '';
      if (completedOrders.length === 0) { compList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">尚無已完成訂單</div>'; return; }

      for (var i = 0; i < completedOrders.length; i++) {
        var comp = completedOrders[i];
        var card = document.createElement('div');

        if (comp.items) {
          comp.items.forEach(it => {

            itemsHtml += '<div style="font-size:13px; margin-bottom:4px; color:var(--text-main);">• ' + it.itemName + ' (尺寸 ' + it.unit + '): <b>' + it.count + ' 件</b> (NT$ ' + ((parseInt(it.ntPrice) || 0) * it.count).toLocaleString() + ')</div>';
          });

        card.innerHTML = '<div class="customer-name"><span style="color:var(--text-main);">✅ 訂單 ' + (comp.orderId || '一般') + ' - ' + comp.buyerName + ' (NT$ ' + totalNt.toLocaleString() + ') <small style="font-size:11px; color:#666;">(' + comp.completedAt + ')</small></span>' +
          '<div style="display:flex; gap:4px;"><button class="btn-edit-order" style="background:var(--accent);" onclick="restoreCompletedOrder(' + i + ')">↩️ 恢復</button>' +
          '<button class="btn-del-prod" style="padding:2px 8px; font-size:11px;" onclick="deleteCompletedOrder(' + i + ')">刪除</button></div></div>' + itemsHtml;

    function updateAdminProductList() {
      var prodListEl = document.getElementById('adminProductList');
      if (!prodListEl) return; prodListEl.innerHTML = '';
      var header = document.createElement('div');
      header.style.cssText = "font-size:16px; font-weight:bold; margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border-color);";

          '<div style="font-size:12px; color:var(--text-sub); margin-bottom:4px;">分類：' + p.category + ' | 尺寸：[' + (p.units || []).join(',') + ']</div>' +

          '<button class="btn-del-prod" onclick="deleteItemFromAdmin(' + i + ')">🗑️ 刪除</button></div></div>';

    function updateAdminStats() {
      if (document.activeElement && document.activeElement.classList.contains('stats-input')) return;
      var contentList = document.getElementById('adminStatsContentList');
      if (!contentList) return; contentList.innerHTML = '';
      var activeItemsCount = 0;

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        if (!p.buyers) p.buyers = [];
        var totalOrderedCount = 0;
        p.buyers.forEach(b => { totalOrderedCount += (b.count || 0); });
        if (totalOrderedCount <= 0) continue;

        activeItemsCount++;
        if (!p.purchasedCounts) p.purchasedCounts = {};
        var unitTotals = {}; var buyersHtml = '';

        for (var j = 0; j < p.buyers.length; j++) {
          var b = p.buyers[j];
          if ((b.count || 0) <= 0) continue;
          var u = b.unit || '100';
          if (!unitTotals[u]) unitTotals[u] = 0;
          unitTotals[u] += b.count;
          buyersHtml += '<div style="font-size:12px; color:var(--text-sub); margin-left:12px;">📦 [' + (b.orderId || '一般') + '] ' + b.name + ': <b>' + b.count + ' 件</b> (尺寸 ' + u + ')</div>';
        }

        var progressHtml = '';
        var unitsArr = p.units && p.units.length > 0 ? p.units : ['100'];

        for (var uIdx = 0; uIdx < unitsArr.length; uIdx++) {
          var unitKey = unitsArr[uIdx];
          var totalNeeded = unitTotals[unitKey] || 0;
          if (totalNeeded <= 0) continue;

          var boughtCount = p.purchasedCounts[unitKey] || 0;
          var pricing = getUnitPricing(p, unitKey);

          progressHtml += '<div class="progress-box" style="background:#FAFAFA; border:1px solid #EFECE6; padding:10px; border-radius:10px; margin-bottom:8px;">' +
            '<div style="font-weight:bold; font-size:13px; color:var(--accent); margin-bottom:6px;">👕 尺寸 [' + unitKey + '] 採購設定</div>' +
            '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:6px;">' +
              '<div><label style="font-size:11px; color:#666;">韓幣買入 (₩)</label><input type="text" class="form-input stats-input" value="' + pricing.krwPrice + '" oninput="updateUnitPricingInput(' + i + ', \'' + unitKey + '\', \'krwPrice\', this.value, this)" /></div>' +
              '<div><label style="font-size:11px; color:#666;">匯率</label><input type="number" step="0.1" class="form-input stats-input" value="' + pricing.rate + '" oninput="updateUnitPricingInput(' + i + ', \'' + unitKey + '\', \'rate\', this.value, this)" /></div>' +
            '</div>' +
            '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:8px;">' +
              '<div><label style="font-size:11px; color:#666;">換算台幣</label><input type="text" class="form-input" style="background:#eee;" readonly value="NT$ ' + (pricing.krwPrice ? Math.round(parseInt(pricing.krwPrice.replace(/,/g,'')) / pricing.rate) : 0) + '" /></div>' +
              '<div><label style="font-size:11px; color:#666;">售價 (NT$)</label><input type="text" class="form-input stats-input" style="font-weight:bold; color:#28A745;" value="' + pricing.ntPrice + '" oninput="updateUnitPricingInput(' + i + ', \`' + unitKey + '\`, \'ntPrice\', this.value, this)" /></div>' +
            '</div>' +
            '<div class="progress-row"><span style="font-size:12px;">🛒 採購進度：<b>已買 ' + boughtCount + ' / 共 ' + totalNeeded + ' 件</b></span>' +
            '<div class="progress-controls"><button class="btn-mini-qty" onclick="updatePurchasedQty(' + i + ', \'' + unitKey + '\', -1)">-</button><button class="btn-mini-qty" onclick="updatePurchasedQty(' + i + ', \'' + unitKey + '\', 1)">+</button></div></div>' +
          '</div>';
        }

        var row = document.createElement('div');
        row.className = 'admin-item-row';
        row.innerHTML = '<img src="' + (p.image ? fixImageUrl(p.image) : '') + '" class="admin-thumb" alt="" />' +
          '<div class="admin-item-info"><div class="admin-item-title"><span>👕 ' + p.name + '</span></div>' + buyersHtml + progressHtml + '</div>';
        contentList.appendChild(row);
      }

      if (activeItemsCount === 0) {
        contentList.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">目前尚無人下單，訂單管理無待採購項目</div>';
        return;
      }
    }

    function openEditProdModal(index) {
      editingProdIndex = index;
      var p = products[index];
      document.getElementById('editProdName').value = p.name;
      document.getElementById('editProdCategory').value = p.category || '上衣/T恤';
      document.getElementById('editProdUnits').value = (p.units || []).join(',');
      document.getElementById('editProdNote').value = p.note || '';
      document.getElementById('editProdImage').value = p.image || '';
      document.getElementById('editProdHidden').checked = !!p.isHidden;
      document.getElementById('editProdModal').style.display = 'flex';
    }
    function closeEditProdModal() { document.getElementById('editProdModal').style.display = 'none'; }

    function saveEditProd() {
      if (editingProdIndex !== null) {
        var p = products[editingProdIndex];
        p.name = document.getElementById('editProdName').value.trim();
        p.category = document.getElementById('editProdCategory').value;
        p.units = document.getElementById('editProdUnits').value.split(',').map(s => s.trim()).filter(Boolean);
        p.note = document.getElementById('editProdNote').value.trim();
        p.image = document.getElementById('editProdImage').value.trim();
        p.isHidden = document.getElementById('editProdHidden').checked;
        renderList(); updateAdminProductList(); updateAdminStats(); manualSaveData(false); closeEditProdModal();
        alert('✅ 修改成功！');
      }
    }

    function saveNewProd() {
      var name = document.getElementById('itemName').value.trim();
      if (!name) { alert('請填寫款式名稱！'); return; }
      var category = document.getElementById('itemCategory').value;
      var units = document.getElementById('itemUnits').value.split(',').map(s => s.trim()).filter(Boolean);
      var note = document.getElementById('itemNote').value.trim();
      var image = document.getElementById('itemImage').value.trim();

      products.unshift({ id: Date.now(), name: name, prices: {}, buyers: [], category: category, units: units.length ? units : ['100'], note: note, image: image, purchasedCounts: {}, isCompleted: false, isHidden: false });
      renderList(); updateAdminProductList(); updateAdminStats(); manualSaveData(false);
      document.getElementById('itemName').value = ''; document.getElementById('itemNote').value = ''; document.getElementById('itemImage').value = '';
      closeModal('adminModal'); alert('🎉 新增童裝成功！');
    }

    function switchTab(tabNum) {
      document.querySelectorAll('.admin-tab-btn').forEach((btn, idx) => {
        var targets = [1, 7, 8, 2, 6, 3, 4];
        btn.className = 'admin-tab-btn' + (targets[idx] === tabNum ? ' active' : '');
      });
      document.querySelectorAll('.admin-section').forEach((sec, idx) => {
        var targets = [1, 7, 8, 2, 6, 3, 4];
        sec.className = 'admin-section' + (targets[idx] === tabNum ? ' active' : '');
      });

      if (tabNum === 1) updateAdminProductList();
      else if (tabNum === 7) updateAdminStats();
      else if (tabNum === 8) updateDailyRevenueStats();
      else if (tabNum === 2) updateCustomerStats();
      else if (tabNum === 6) updateCompletedOrdersStats();
    }
  </script>
</body>
</html>
