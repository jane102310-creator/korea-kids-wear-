<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>童裝庫存・檔口叫貨</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<!--
【Firestore 安全規則】這個 Firebase 專案和「韓國代購清單」共用，所以本網頁的資料都放在 kids_ 開頭的集合。
請在 Firebase 控制台 → Firestore Database → 規則 裡，保留原本的規則，在 match /databases/{database}/documents { 裡面加上這段（把 你的信箱 換成管理者信箱）：
    match /kids_products/{id}  { allow read, write: if request.auth != null && request.auth.token.email == '你的信箱'; }
    match /kids_stalls/{id}    { allow read, write: if request.auth != null && request.auth.token.email == '你的信箱'; }
    match /kids_purchases/{id} { allow read, write: if request.auth != null && request.auth.token.email == '你的信箱'; }
    match /kids_settings/{id}  { allow read, write: if request.auth != null && request.auth.token.email == '你的信箱'; }
帳號：Firebase 控制台 → Authentication → 新增使用者（Email/密碼）。信箱只寫在規則裡，不放在網頁程式中。
-->
<style>
:root{--bg:#FDFBF7;--card:#fff;--text:#5A4D41;--sub:#8C705F;--acc:#8C705F;--light:#F4EBE1;--bd:#EFECE6;--sh:0 4px 16px rgba(90,77,65,.06);--ok:#2E8B57;--warn:#D9534F;--wait:#C98A2B}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif}
body{background:var(--bg);color:var(--text);padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
.wrap{max-width:520px;margin:0 auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:19px}
.sec{display:none}.sec.on{display:block}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{background:var(--card);border:1px solid var(--bd);color:var(--sub);padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0;font-size:12px;color:var(--sub);cursor:pointer;line-height:1.5}
nav button.on{color:var(--acc);font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.big{width:100%;padding:13px;font-size:15px;border-radius:14px;margin-top:10px}
.btn.line{background:#fff;color:var(--sub);border:1px solid var(--bd)}
.btn.red{background:var(--warn)}.btn.green{background:var(--ok)}.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.muted{color:#9a8f85;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(90,77,65,.4);display:none;justify-content:center;align-items:flex-end;z-index:200}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.sheet h2{font-size:18px;display:flex;justify-content:space-between;margin-bottom:10px}
.sheet h2 span{cursor:pointer;color:var(--sub)}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#FAFAFA;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{display:flex;gap:12px}
.prod img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--light);flex-shrink:0}
.prod .info{flex:1;min-width:0}
.prod b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sz{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;overflow:hidden;font-size:13px}
.sz span{padding:5px 8px;background:var(--light);font-weight:600}
.sz button{width:28px;height:30px;border:0;background:#fff;font-size:16px;color:var(--sub);cursor:pointer}
.sz b{min-width:22px;text-align:center}
.sz.zero b{color:var(--warn)}
.tag{display:inline-block;font-size:11px;background:var(--light);color:var(--sub);padding:2px 8px;border-radius:6px;margin-right:4px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.st.ordered{background:#FDF1DE;color:var(--wait)}.st.arrived{background:#E3F3EA;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}.stats small{color:var(--sub);font-size:11px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#5A4D41;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:999;display:none;max-width:90%}
.empty{text-align:center;color:#999;padding:28px;font-size:14px}
#login{max-width:360px;margin:12vh auto 0}
</style>
</head>
<body>

<div id="login" class="box" style="display:none">
  <h1 style="text-align:center;margin-bottom:6px">童裝庫存・檔口叫貨</h1>
  <p class="muted" style="text-align:center">管理者登入</p>
  <label>信箱</label><input id="lEmail" type="email" autocomplete="username">
  <label>密碼</label><input id="lPwd" type="password" autocomplete="current-password">
  <button class="btn big" data-act="login">登入</button>
</div>

<div class="wrap" id="app" style="display:none">
  <header><h1 id="title">童裝庫存・檔口叫貨</h1><button class="btn line sm" data-act="logout">登出</button></header>

  <!-- 庫存 -->
  <div id="s-stock" class="sec on">
    <div class="stats" id="stockStats"></div>
    <input id="q" placeholder="🔍 搜尋款式名稱" style="margin-bottom:10px">
    <div class="pills" id="stallPills"></div>
    <button class="btn big" style="margin:0 0 12px" data-act="newProd">➕ 新增款式</button>
    <div id="stockList"></div>
  </div>

  <!-- 叫貨紀錄 -->
  <div id="s-buy" class="sec">
    <div class="stats" id="buyStats"></div>
    <div class="pills" id="buyPills"></div>
    <button class="btn big" style="margin:0 0 12px" data-act="newBuy">📝 新增叫貨</button>
    <div id="buyList"></div>
  </div>

  <!-- 出貨紀錄 -->
  <div id="s-ship" class="sec">
    <div class="stats" id="shipStats"></div>
    <input id="sq" placeholder="🔍 搜尋買家、款式、訂單編號" style="margin-bottom:10px">
    <div class="pills" id="shipPills"></div>
    <button class="btn big" style="margin:0 0 12px" data-act="newShip">📤 新增出貨</button>
    <div id="shipList"></div>
  </div>

  <!-- 檔口 -->
  <div id="s-stall" class="sec">
    <button class="btn big" style="margin:0 0 12px" data-act="newStall">🏪 新增檔口</button>
    <div id="stallList"></div>
  </div>

  <!-- 設定 -->
  <div id="s-set" class="sec">
    <div class="box">
      <label style="margin-top:0">匯率（1 台幣 = ? 韓幣）</label><input id="sRate" type="number" step="0.1" inputmode="decimal">
      <button class="btn big" data-act="saveSettings">儲存匯率</button>
    </div>
    <div class="box">
      <b>匯出資料</b>
      <button class="btn big line" data-act="exportStock">📦 匯出庫存 CSV</button>
      <button class="btn big line" data-act="exportBuy">📝 匯出叫貨紀錄 CSV</button>
      <button class="btn big line" data-act="exportShip">📤 匯出出貨紀錄 CSV</button>
    </div>
    <div class="box">
      <b>修正庫存</b>
      <p class="muted" style="margin-top:4px">庫存數字對不上時，依「已到貨的叫貨 − 出貨紀錄」重新計算（會覆蓋手動 +／− 的調整）。</p>
      <button class="btn big line" data-act="recalc">🔄 依叫貨紀錄重算庫存</button>
    </div>
  </div>
</div>

<nav id="nav" style="display:none">
  <button class="on" data-act="nav" data-id="stock">📦<br>庫存</button>
  <button data-act="nav" data-id="buy">📝<br>叫貨紀錄</button>
  <button data-act="nav" data-id="ship">📤<br>出貨</button>
  <button data-act="nav" data-id="stall">🏪<br>檔口</button>
  <button data-act="nav" data-id="set">⚙️<br>設定</button>
</nav>

<!-- 款式 -->
<div class="mask" id="m-prod"><div class="sheet">
  <h2><b id="pTitle">新增款式</b><span data-act="close" data-id="m-prod">✕</span></h2>
  <label>款式名稱 *</label><input id="pName">
  <div class="two">
    <div><label>分類</label><select id="pCat"></select></div>
    <div><label>常用檔口</label><select id="pStall"></select></div>
  </div>
  <label>尺寸（逗號隔開）</label><input id="pUnits" value="90,100,110,120,130">
  <div class="two">
    <div><label>韓幣進價</label><input id="pKrw" type="number" inputmode="numeric" placeholder="25000"></div>
    <div><label>售價 NT$</label><input id="pNt" type="number" inputmode="numeric" placeholder="650"></div>
  </div>
  <label>圖片（≤5MB）</label><input type="file" id="pFile" accept="image/*">
  <input id="pImg" placeholder="或貼上圖片網址" style="margin-top:6px">
  <label>備註</label><input id="pNote">
  <button class="btn big" data-act="saveProd">儲存</button>
  <button class="btn big red" id="pDel" data-act="delProd">刪除此款式</button>
</div></div>

<!-- 叫貨 -->
<div class="mask" id="m-buy"><div class="sheet">
  <h2><b id="bTitle">新增叫貨</b><span data-act="close" data-id="m-buy">✕</span></h2>
  <div class="two">
    <div><label>日期</label><input id="bDate" type="date"></div>
    <div><label>檔口 *</label><select id="bStall"></select></div>
  </div>
  <label>款式 *</label><select id="bProd"></select>
  <label>各尺寸數量</label><div class="sizes" id="bSizes"></div>
  <label>單件韓幣</label><input id="bKrw" type="number" inputmode="numeric">
  <label>備註</label><input id="bNote" placeholder="例如：週五到貨、顏色米白">
  <button class="btn big" data-act="saveBuy">儲存</button>
  <button class="btn big red" id="bDel" data-act="delBuy">刪除此紀錄</button>
</div></div>

<!-- 出貨 -->
<div class="mask" id="m-ship"><div class="sheet">
  <h2><b id="hTitle">新增出貨</b><span data-act="close" data-id="m-ship">✕</span></h2>
  <div class="two">
    <div><label>日期</label><input id="hDate" type="date"></div>
    <div><label>平台</label><select id="hPlat"></select></div>
  </div>
  <label>款式 *</label><select id="hProd"></select>
  <label>各尺寸出貨數量 <span class="muted">（灰字為目前庫存）</span></label><div class="sizes" id="hSizes"></div>
  <div class="two">
    <div><label>買家</label><input id="hBuyer"></div>
    <div><label>訂單編號</label><input id="hOrder"></div>
  </div>
  <label>單件售價 NT$</label><input id="hNt" type="number" inputmode="numeric">
  <label>備註</label><input id="hNote">
  <button class="btn big" data-act="saveShip">儲存（自動扣庫存）</button>
  <button class="btn big red" id="hDel" data-act="delShip">刪除此紀錄（庫存加回）</button>
</div></div>

<!-- 檔口 -->
<div class="mask" id="m-stall"><div class="sheet">
  <h2><b id="tTitle">新增檔口</b><span data-act="close" data-id="m-stall">✕</span></h2>
  <label>檔口名稱 *</label><input id="tName" placeholder="例如：Nyunyu 3F 小熊屋">
  <label>位置 / 商場</label><input id="tLoc" placeholder="東大門、南大門…">
  <label>聯絡方式</label><input id="tContact" placeholder="KakaoTalk ID、電話">
  <label>備註</label><input id="tNote">
  <button class="btn big" data-act="saveStall">儲存</button>
  <button class="btn big red" id="tDel" data-act="delStall">刪除此檔口</button>
</div></div>

<div id="toast"></div>

<script>
const PLATS=['蝦皮','賣貨便','面交','其他'];
const CATS=["上衣/T恤","褲子/裙裝","外套/針織","配件/鞋帽","其他"];
firebase.initializeApp({
  apiKey:"AIzaSyBHmyi3-dmv2Zcn8ULXwuIIODSWVdcDTdY",authDomain:"korea-buy-list.firebaseapp.com",
  projectId:"korea-buy-list",storageBucket:"korea-buy-list.firebasestorage.app",
  messagingSenderId:"131856493166",appId:"1:131856493166:web:1f4a1c108ffbfdb89a547f"
});
const db=firebase.firestore(),auth=firebase.auth(),storage=firebase.storage(),FV=firebase.firestore.FieldValue;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const nt=n=>'NT$ '+Math.round(num(n)).toLocaleString();
const krw=n=>'₩'+num(n).toLocaleString();
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
const ph='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

let products=[],stalls=[],buys=[],ships=[],settings={rate:41.5};
let platFilter='全部',stallFilter='全部',buyFilter='ordered',editId=null,unsubs=[];

// 舊版商品的價格存在 prices[尺寸]，新版用 krw / nt；兩種都讀得到
const pKrw=p=>num(p.krw)||num(Object.values(p.prices||{}).map(x=>x&&x.krw).find(v=>num(v)));
const pNt=p=>num(p.nt)||num(Object.values(p.prices||{}).map(x=>x&&x.nt).find(v=>num(v)));
const stockOf=(p,u)=>num((p.stock||{})[u]);
const stallName=id=>(stalls.find(s=>s.id===id)||{}).name||'未指定檔口';

// ===== 登入 =====
auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];
  $('login').style.display=u?'none':'block';
  $('app').style.display=$('nav').style.display=u?'':'none';
  if(!u)return;
  const err=e=>{console.error(e);if(e.code==='permission-denied')toast('這個帳號沒有權限，請確認 Firebase 規則裡的信箱')};
  unsubs.push(
    db.collection('kids_products').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(b.name,'zh-Hant'));render()},err),
    db.collection('kids_stalls').onSnapshot(s=>{stalls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(b.name,'zh-Hant'));render()},err),
    db.collection('kids_purchases').onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date).localeCompare(a.date)||num(b.createdAtMs)-num(a.createdAtMs));buys=all.filter(x=>x.type!=='ship');ships=all.filter(x=>x.type==='ship');render()},err),
    db.collection('kids_settings').doc('site').onSnapshot(d=>{if(d.exists)settings={...settings,...d.data()};$('sRate').value=settings.rate},err)
  );
});

// ===== 畫面 =====
function render(){renderStock();renderBuys();renderShips();renderStalls()}
function renderStock(){
  const kw=$('q').value.trim().toLowerCase();
  const total=products.reduce((s,p)=>s+(p.units||[]).reduce((a,u)=>a+stockOf(p,u),0),0);
  const value=products.reduce((s,p)=>s+(p.units||[]).reduce((a,u)=>a+stockOf(p,u),0)*pKrw(p),0);
  const out=products.filter(p=>(p.units||[]).some(u=>stockOf(p,u)<=0)).length;
  $('stockStats').innerHTML=`<div><b>${total}</b><small>庫存件數</small></div><div><b>${nt(value/(settings.rate||41.5))}</b><small>庫存成本</small></div><div><b style="color:var(--warn)">${out}</b><small>有尺寸缺貨</small></div>`;
  $('stallPills').innerHTML=['全部',...stalls.map(s=>s.id)].map(id=>`<button class="pill ${id===stallFilter?'on':''}" data-act="stallFilter" data-id="${esc(id)}">${esc(id==='全部'?'全部檔口':stallName(id))}</button>`).join('');
  const list=products.filter(p=>(stallFilter==='全部'||p.stallId===stallFilter)&&(!kw||String(p.name).toLowerCase().includes(kw)));
  $('stockList').innerHTML=list.length?list.map(p=>{
    const sizes=(p.units||[]).map(u=>`<div class="sz ${stockOf(p,u)<=0?'zero':''}"><span>${esc(u)}</span><button data-act="stock" data-id="${p.id}" data-u="${esc(u)}" data-d="-1">−</button><b>${stockOf(p,u)}</b><button data-act="stock" data-id="${p.id}" data-u="${esc(u)}" data-d="1">+</button></div>`).join('');
    const sold=ships.filter(h=>h.productId===p.id).reduce((a,h)=>a+sumQty(h),0);
    const price=[pKrw(p)?krw(pKrw(p)):'',pNt(p)?'售 '+nt(pNt(p)):'',sold?'已賣 '+sold+' 件':''].filter(Boolean).join(' · ');
    return `<div class="box"><div class="prod" data-act="editProd" data-id="${p.id}"><img src="${esc(p.image||ph)}" alt="" loading="lazy"><div class="info"><b>${esc(p.name)}</b><div style="margin:4px 0"><span class="tag">${esc(p.category||'未分類')}</span><span class="tag">🏪 ${esc(stallName(p.stallId))}</span></div><div class="muted">${esc(price)}${p.note?' ・ '+esc(p.note):''}</div></div></div><div class="sizes">${sizes}</div></div>`;
  }).join(''):`<div class="empty">${products.length?'找不到符合的款式':'還沒有款式，先新增一個吧'}</div>`;
}
function renderBuys(){
  const ord=buys.filter(b=>b.status!=='arrived');
  const pcs=ord.reduce((s,b)=>s+sumQty(b),0);
  const money=ord.reduce((s,b)=>s+sumQty(b)*num(b.krw),0);
  $('buyStats').innerHTML=`<div><b>${ord.length}</b><small>待到貨筆數</small></div><div><b>${pcs}</b><small>待到貨件數</small></div><div><b>${krw(money)}</b><small>待到貨金額</small></div>`;
  $('buyPills').innerHTML=[['ordered','⏳ 已叫貨'],['arrived','✅ 已到貨'],['all','全部']].map(t=>`<button class="pill ${t[0]===buyFilter?'on':''}" data-act="buyFilter" data-id="${t[0]}">${t[1]}</button>`).join('');
  const list=buys.filter(b=>buyFilter==='all'||(buyFilter==='arrived')===(b.status==='arrived'));
  $('buyList').innerHTML=list.length?list.map(b=>{
    const arrived=b.status==='arrived';
    const q=Object.entries(b.qty||{}).filter(([,n])=>num(n)>0).map(([u,n])=>`${esc(u)}×${n}`).join('　');
    return `<div class="box"><div class="row"><b>${esc(b.productName)}</b><span class="st ${arrived?'arrived':'ordered'}">${arrived?'已到貨':'已叫貨'}</span></div>
      <div class="row muted"><span>🏪 ${esc(stallName(b.stallId))}</span><span>${esc(b.date)}</span></div>
      <div class="row"><span>${q||'—'}</span><span>${krw(sumQty(b)*num(b.krw))}</span></div>
      ${b.note?`<div class="muted">📝 ${esc(b.note)}</div>`:''}
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn line sm" data-act="editBuy" data-id="${b.id}">編輯</button>${arrived?`<button class="btn line sm" data-act="unarrive" data-id="${b.id}">↩️ 改回未到</button>`:`<button class="btn green sm" data-act="arrive" data-id="${b.id}">✅ 到貨入庫</button>`}</div></div>`;
  }).join(''):'<div class="empty">沒有紀錄</div>';
}
function renderShips(){
  const kw=$('sq').value.trim().toLowerCase();
  const ym=today().slice(0,7);
  const mon=ships.filter(h=>String(h.date).startsWith(ym));
  $('shipStats').innerHTML=`<div><b>${mon.length}</b><small>本月出貨筆數</small></div><div><b>${mon.reduce((a,h)=>a+sumQty(h),0)}</b><small>本月出貨件數</small></div><div><b>${nt(mon.reduce((a,h)=>a+sumQty(h)*num(h.nt),0))}</b><small>本月營收</small></div>`;
  $('shipPills').innerHTML=['全部',...PLATS].map(t=>`<button class="pill ${t===platFilter?'on':''}" data-act="platFilter" data-id="${esc(t)}">${esc(t)}</button>`).join('');
  const list=ships.filter(h=>(platFilter==='全部'||h.platform===platFilter)&&(!kw||[h.buyer,h.productName,h.orderNo].some(v=>String(v||'').toLowerCase().includes(kw))));
  $('shipList').innerHTML=list.length?list.map(h=>{
    const q=Object.entries(h.qty||{}).filter(([,n])=>num(n)>0).map(([u,n])=>`${esc(u)}×${n}`).join('　');
    return `<div class="box" data-act="editShip" data-id="${h.id}" style="cursor:pointer"><div class="row"><b>${esc(h.productName)}</b><span class="tag">${esc(h.platform||'其他')}</span></div>
      <div class="row muted"><span>👤 ${esc(h.buyer||'未填買家')}${h.orderNo?'・#'+esc(h.orderNo):''}</span><span>${esc(h.date)}</span></div>
      <div class="row"><span>${q||'—'}</span><span class="price" style="color:var(--ok);font-weight:700">${nt(sumQty(h)*num(h.nt))}</span></div>
      ${h.note?`<div class="muted">📝 ${esc(h.note)}</div>`:''}</div>`;
  }).join(''):'<div class="empty">沒有出貨紀錄</div>';
}
function renderStalls(){
  $('stallList').innerHTML=stalls.length?stalls.map(s=>{
    const mine=buys.filter(b=>b.stallId===s.id);
    const pending=mine.filter(b=>b.status!=='arrived').reduce((a,b)=>a+sumQty(b),0);
    const spent=mine.reduce((a,b)=>a+sumQty(b)*num(b.krw),0);
    return `<div class="box" data-act="editStall" data-id="${s.id}" style="cursor:pointer"><div class="row"><b style="font-size:15px">🏪 ${esc(s.name)}</b><span class="muted">${esc(s.loc||'')}</span></div>
      ${s.contact?`<div class="muted">📱 ${esc(s.contact)}</div>`:''}${s.note?`<div class="muted">📝 ${esc(s.note)}</div>`:''}
      <div class="row" style="margin-top:6px"><span>款式 ${products.filter(p=>p.stallId===s.id).length}・叫貨 ${mine.length} 筆・待到 ${pending} 件</span><b>${krw(spent)}</b></div></div>`;
  }).join(''):'<div class="empty">還沒有檔口，先新增一個吧</div>';
}
const sumQty=b=>Object.values(b.qty||{}).reduce((s,n)=>s+num(n),0);
const opts=(arr,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(([v,t])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`).join('');
function open(id){$(id).classList.add('on');document.body.classList.add('lock')}

// ===== 動作 =====
const ACT={
  async login(){
    try{await auth.signInWithEmailAndPassword($('lEmail').value.trim(),$('lPwd').value)}
    catch(e){toast('登入失敗：信箱或密碼錯誤')}
  },
  logout(){auth.signOut()},
  nav(id,_,t){
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));
    scrollTo(0,0);
  },
  close(id){$(id).classList.remove('on');document.body.classList.toggle('lock',!!document.querySelector('.mask.on'))},
  stallFilter(id){stallFilter=id;renderStock()},
  buyFilter(id){buyFilter=id;renderBuys()},
  async stock(id,u,t){
    const p=products.find(x=>x.id===id);if(!p)return;
    const d=Number(t.dataset.d);if(d<0&&stockOf(p,u)<=0)return;
    try{await db.collection('kids_products').doc(id).set({stock:{[String(u)]:FV.increment(d)}},{merge:true})}catch(e){toast('更新失敗：'+e.message)}
  },
  // 款式
  newProd(){editId=null;fillProd({stallId:stallFilter==='全部'?'':stallFilter})},
  editProd(id){editId=id;fillProd(products.find(p=>p.id===id)||{})},
  async saveProd(){
    const name=$('pName').value.trim();if(!name)return toast('請填寫款式名稱');
    const units=[...new Set($('pUnits').value.split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean))];
    if(!units.length)return toast('請至少填一個尺寸');
    let image=$('pImg').value.trim();const f=$('pFile').files[0];
    try{
      if(f){
        if(f.size>5*1024*1024)return toast('圖片不能超過 5MB');
        toast('圖片上傳中…');
        const ref=storage.ref('kids_products/'+Date.now()+'_'+f.name.replace(/[^\w.]/g,''));
        await ref.put(f);image=await ref.getDownloadURL();
      }
      const data={name,category:$('pCat').value,stallId:$('pStall').value,units,krw:num($('pKrw').value),nt:num($('pNt').value),image,note:$('pNote').value.trim()};
      if(editId)await db.collection('kids_products').doc(editId).update(data);
      else await db.collection('kids_products').add({...data,stock:{},createdAt:FV.serverTimestamp()});
      ACT.close('m-prod');toast('✅ 已儲存');
    }catch(e){toast('儲存失敗：'+e.message)}
  },
  async delProd(){
    if(!editId||!confirm('確定刪除此款式？庫存數量也會一起刪除（叫貨紀錄會保留）'))return;
    await db.collection('kids_products').doc(editId).delete();ACT.close('m-prod');toast('已刪除');
  },
  // 叫貨
  newBuy(){
    if(!products.length)return toast('請先到「庫存」新增款式');
    editId=null;fillBuy({date:today(),status:'ordered'});
  },
  editBuy(id){editId=id;fillBuy(buys.find(b=>b.id===id)||{})},
  async saveBuy(){
    const p=products.find(x=>x.id===$('bProd').value);if(!p)return toast('請選擇款式');
    const stallId=$('bStall').value;if(!stallId)return toast('請選擇檔口（可先到「檔口」新增）');
    const qty={};document.querySelectorAll('#bSizes [data-u]').forEach(el=>{const n=num(el.value);if(n>0)qty[el.dataset.u]=n});
    if(!Object.keys(qty).length)return toast('請至少填一個尺寸的數量');
    const data={date:$('bDate').value||today(),stallId,productId:p.id,productName:p.name,qty,krw:num($('bKrw').value),note:$('bNote').value.trim()};
    try{
      if(editId){
        const old=buys.find(b=>b.id===editId);
        const batch=db.batch();batch.update(db.collection('kids_purchases').doc(editId),data);
        if(old&&old.status==='arrived'){moveStock(batch,old,-1);moveStock(batch,{...data},1)}
        await batch.commit();
      }else await db.collection('kids_purchases').add({...data,status:'ordered',createdAtMs:Date.now()});
      if(!p.stallId)db.collection('kids_products').doc(p.id).update({stallId}).catch(()=>{});
      ACT.close('m-buy');toast('✅ 已儲存');
    }catch(e){toast('儲存失敗：'+e.message)}
  },
  async delBuy(){
    const b=buys.find(x=>x.id===editId);if(!b)return;
    const arrived=b.status==='arrived';
    if(!confirm(arrived?'這筆已入庫，刪除時會一併扣回庫存，確定？':'確定刪除此叫貨紀錄？'))return;
    const batch=db.batch();batch.delete(db.collection('kids_purchases').doc(b.id));if(arrived)moveStock(batch,b,-1);
    ACT.close('m-buy');await commit(batch,'已刪除');
  },
  async arrive(id){
    const b=buys.find(x=>x.id===id);if(!b)return;
    if(!products.some(p=>p.id===b.productId))return toast('這個款式已被刪除，無法入庫');
    const batch=db.batch();batch.update(db.collection('kids_purchases').doc(id),{status:'arrived',arrivedAtMs:Date.now()});moveStock(batch,b,1);
    await commit(batch,'✅ 已入庫 '+sumQty(b)+' 件');
  },
  async unarrive(id){
    const b=buys.find(x=>x.id===id);if(!b||!confirm('改回未到貨？會從庫存扣回這些數量'))return;
    const batch=db.batch();batch.update(db.collection('kids_purchases').doc(id),{status:'ordered'});moveStock(batch,b,-1);
    await commit(batch,'已改回未到貨');
  },
  // 出貨
  platFilter(id){platFilter=id;renderShips()},
  newShip(){
    if(!products.length)return toast('請先到「庫存」新增款式');
    editId=null;fillShip({date:today(),platform:PLATS[0]});
  },
  editShip(id){editId=id;fillShip(ships.find(h=>h.id===id)||{})},
  async saveShip(){
    const p=products.find(x=>x.id===$('hProd').value);if(!p)return toast('請選擇款式');
    const qty={};document.querySelectorAll('#hSizes [data-u]').forEach(el=>{const n=num(el.value);if(n>0)qty[el.dataset.u]=n});
    if(!Object.keys(qty).length)return toast('請至少填一個尺寸的數量');
    const old=editId?ships.find(h=>h.id===editId):null;
    const short=Object.entries(qty).filter(([u,n])=>{const back=old&&old.productId===p.id?num((old.qty||{})[u]):0;return n>stockOf(p,u)+back}).map(([u])=>u);
    if(short.length&&!confirm('尺寸 '+short.join('、')+' 庫存不足，出貨後會變成負數，確定要儲存？'))return;
    const data={type:'ship',date:$('hDate').value||today(),platform:$('hPlat').value,productId:p.id,productName:p.name,qty,buyer:$('hBuyer').value.trim(),orderNo:$('hOrder').value.trim(),nt:num($('hNt').value),note:$('hNote').value.trim()};
    const batch=db.batch();
    if(old){batch.update(db.collection('kids_purchases').doc(old.id),data);moveStock(batch,old,1)}
    else batch.set(db.collection('kids_purchases').doc(),{...data,createdAtMs:Date.now()});
    moveStock(batch,data,-1);
    ACT.close('m-ship');await commit(batch,'✅ 已出貨，庫存已扣除');
  },
  async delShip(){
    const h=ships.find(x=>x.id===editId);if(!h||!confirm('刪除這筆出貨紀錄？庫存會加回去'))return;
    const batch=db.batch();batch.delete(db.collection('kids_purchases').doc(h.id));moveStock(batch,h,1);
    ACT.close('m-ship');await commit(batch,'已刪除，庫存已加回');
  },
  // 檔口
  newStall(){editId=null;fillStall({})},
  editStall(id){editId=id;fillStall(stalls.find(s=>s.id===id)||{})},
  async saveStall(){
    const name=$('tName').value.trim();if(!name)return toast('請填寫檔口名稱');
    const data={name,loc:$('tLoc').value.trim(),contact:$('tContact').value.trim(),note:$('tNote').value.trim()};
    try{
      if(editId)await db.collection('kids_stalls').doc(editId).update(data);
      else await db.collection('kids_stalls').add({...data,createdAtMs:Date.now()});
      ACT.close('m-stall');toast('✅ 已儲存');
    }catch(e){toast('儲存失敗：'+e.message)}
  },
  async delStall(){
    if(!editId||!confirm('確定刪除此檔口？相關款式和紀錄會變成「未指定檔口」'))return;
    await db.collection('kids_stalls').doc(editId).delete();
    if(stallFilter===editId)stallFilter='全部';
    ACT.close('m-stall');toast('已刪除');
  },
  // 設定
  async saveSettings(){
    const rate=parseFloat($('sRate').value);if(!(rate>0))return toast('請輸入有效匯率');
    await db.collection('kids_settings').doc('site').set({rate},{merge:true});toast('✅ 匯率已更新');
  },
  async recalc(){
    if(!confirm('依「已到貨的叫貨 − 出貨紀錄」重新計算所有庫存？\n手動用 +／− 調整過的數量會被覆蓋。'))return;
    const batch=db.batch();
    products.forEach(p=>{
      const stock={};(p.units||[]).forEach(u=>stock[u]=0);
      buys.filter(b=>b.status==='arrived'&&b.productId===p.id).forEach(b=>Object.entries(b.qty||{}).forEach(([u,n])=>stock[u]=num(stock[u])+num(n)));
      ships.filter(h=>h.productId===p.id).forEach(h=>Object.entries(h.qty||{}).forEach(([u,n])=>stock[u]=num(stock[u])-num(n)));
      batch.update(db.collection('kids_products').doc(p.id),{stock});
    });
    await commit(batch,'✅ 庫存已重新計算');
  },
  exportStock(){
    const rows=[['款式','分類','檔口','尺寸','庫存','韓幣進價','售價NT$']];
    products.forEach(p=>(p.units||[]).forEach(u=>rows.push([p.name,p.category,stallName(p.stallId),u,stockOf(p,u),pKrw(p),pNt(p)])));
    csv(rows,'庫存');
  },
  exportShip(){
    const rows=[['日期','平台','買家','訂單編號','款式','尺寸','數量','單價NT$','小計NT$','備註']];
    ships.forEach(h=>Object.entries(h.qty||{}).forEach(([u,n])=>rows.push([h.date,h.platform,h.buyer,h.orderNo,h.productName,u,n,num(h.nt),num(n)*num(h.nt),h.note||''])));
    csv(rows,'出貨紀錄');
  },
  exportBuy(){
    const rows=[['日期','檔口','款式','尺寸','數量','單件韓幣','小計韓幣','狀態','備註']];
    buys.forEach(b=>Object.entries(b.qty||{}).forEach(([u,n])=>rows.push([b.date,stallName(b.stallId),b.productName,u,n,num(b.krw),num(n)*num(b.krw),b.status==='arrived'?'已到貨':'已叫貨',b.note||''])));
    csv(rows,'叫貨紀錄');
  }
};
function moveStock(batch,b,sign){
  if(!products.some(p=>p.id===b.productId))return;
  const stock={};Object.entries(b.qty||{}).forEach(([u,n])=>{if(num(n))stock[String(u)]=FV.increment(sign*num(n))});
  if(Object.keys(stock).length)batch.set(db.collection('kids_products').doc(b.productId),{stock},{merge:true});
}
async function commit(batch,msg){
  try{await batch.commit();toast(msg)}catch(e){console.error(e);toast('更新失敗：'+e.message)}
}
function csv(rows,name){
  const text='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8;'}));
  a.download=name+'_'+today()+'.csv';a.click();
}
function fillProd(p){
  $('pTitle').textContent=editId?'編輯款式':'新增款式';
  $('pName').value=p.name||'';
  $('pCat').innerHTML=opts(CATS.map(c=>[c,c]),p.category||CATS[0]);
  $('pStall').innerHTML=opts(stalls.map(s=>[s.id,s.name]),p.stallId||'','未指定');
  $('pUnits').value=(p.units||['90','100','110','120','130']).join(',');
  $('pKrw').value=pKrw(p)||'';$('pNt').value=pNt(p)||'';
  $('pImg').value=p.image||'';$('pFile').value='';$('pNote').value=p.note||'';
  $('pDel').style.display=editId?'':'none';open('m-prod');
}
function fillBuy(b){
  $('bTitle').textContent=editId?'編輯叫貨':'新增叫貨';
  $('bDate').value=b.date||today();
  $('bStall').innerHTML=opts(stalls.map(s=>[s.id,s.name]),b.stallId||(stallFilter!=='全部'?stallFilter:''),'請選擇');
  $('bProd').innerHTML=opts(products.map(p=>[p.id,p.name]),b.productId||'','請選擇');
  $('bKrw').value=b.krw||'';$('bNote').value=b.note||'';
  buySizes(b.qty||{});
  $('bDel').style.display=editId?'':'none';open('m-buy');
}
function buySizes(qty){
  const p=products.find(x=>x.id===$('bProd').value);
  $('bSizes').innerHTML=p?(p.units||[]).map(u=>`<div class="sz"><span>${esc(u)}</span><input data-u="${esc(u)}" type="number" inputmode="numeric" min="0" value="${num(qty[u])||''}" placeholder="0" style="width:56px;border:0;border-radius:0;padding:6px;text-align:center;background:#fff"></div>`).join(''):'<span class="muted">先選款式</span>';
}
function fillShip(h){
  $('hTitle').textContent=editId?'編輯出貨':'新增出貨';
  $('hDate').value=h.date||today();
  $('hPlat').innerHTML=opts(PLATS.map(t=>[t,t]),h.platform||PLATS[0]);
  $('hProd').innerHTML=opts(products.map(p=>[p.id,p.name]),h.productId||'','請選擇');
  $('hBuyer').value=h.buyer||'';$('hOrder').value=h.orderNo||'';$('hNt').value=h.nt||'';$('hNote').value=h.note||'';
  shipSizes(h.qty||{});
  $('hDel').style.display=editId?'':'none';open('m-ship');
}
function shipSizes(qty){
  const p=products.find(x=>x.id===$('hProd').value);
  $('hSizes').innerHTML=p?(p.units||[]).map(u=>`<div class="sz"><span>${esc(u)} <small style="color:#9a8f85;font-weight:500">剩${stockOf(p,u)}</small></span><input data-u="${esc(u)}" type="number" inputmode="numeric" min="0" value="${num(qty[u])||''}" placeholder="0" style="width:52px;border:0;border-radius:0;padding:6px;text-align:center;background:#fff"></div>`).join(''):'<span class="muted">先選款式</span>';
}
function fillStall(s){
  $('tTitle').textContent=editId?'編輯檔口':'新增檔口';
  $('tName').value=s.name||'';$('tLoc').value=s.loc||'';$('tContact').value=s.contact||'';$('tNote').value=s.note||'';
  $('tDel').style.display=editId?'':'none';open('m-stall');
}

$('hProd').addEventListener('change',()=>{
  const p=products.find(x=>x.id===$('hProd').value);shipSizes({});
  if(p&&!$('hNt').value&&pNt(p))$('hNt').value=pNt(p);
});
$('sq').addEventListener('input',renderShips);
$('bProd').addEventListener('change',()=>{
  const p=products.find(x=>x.id===$('bProd').value);buySizes({});
  if(p){if(!$('bKrw').value&&pKrw(p))$('bKrw').value=pKrw(p);if(!$('bStall').value&&p.stallId)$('bStall').value=p.stallId}
});
$('q').addEventListener('input',renderStock);
document.addEventListener('click',e=>{
  if(e.target.classList.contains('mask'))return ACT.close(e.target.id);
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=ACT[t.dataset.act];if(f)f(t.dataset.id,t.dataset.u,t);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&['lEmail','lPwd'].includes(e.target.id))ACT.login()});
</script>
</body>
</html>
