<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韓國童裝連線代購</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<!--
【Firestore 安全規則】請貼到 Firebase 控制台 → Firestore → 規則（把 ADMIN_EMAIL 換成你的管理者信箱）
rules_version = '2';
service cloud.firestore { match /databases/{d}/documents {
  function admin(){ return request.auth != null && request.auth.token.email == 'ADMIN_EMAIL'; }
  match /products/{id} { allow read: if true; allow write: if admin(); }
  match /settings/{id} { allow read: if true; allow write: if admin(); }
  match /orders/{id} {
    allow read: if admin() || (request.auth != null && resource.data.uid == request.auth.uid);
    allow create: if request.auth != null && request.resource.data.uid == request.auth.uid && request.resource.data.status == 'pending';
    allow update, delete: if admin();
  }
  match /userProfiles/{uid} { allow read, write: if admin() || (request.auth != null && request.auth.uid == uid); }
}}
【Storage 規則】 allow read: if true; allow write: if request.auth.token.email == 'ADMIN_EMAIL';
並在 Authentication 建立管理者帳號（Email/密碼），再到 Firestore 把舊的 storeData 商品搬到 products（可選）。
-->
<style>
:root{--bg:#FDFBF7;--card:#fff;--text:#5A4D41;--sub:#8C705F;--acc:#8C705F;--light:#F4EBE1;--bd:#EFECE6;--sh:0 4px 16px rgba(90,77,65,.06)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px 16px 110px}
.wrap{max-width:480px;margin:0 auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
h1{font-size:20px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--sub)}
.sec{display:none}.sec.on{display:block}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.pill{background:var(--card);border:1px solid var(--bd);color:var(--sub);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--sh)}
.item img{width:100%;height:160px;object-fit:cover;background:var(--light);display:block}
.item div{padding:10px;font-size:14px;font-weight:600}
.item small{display:block;color:var(--sub);font-weight:500;margin-top:4px}
nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:50}
nav button{flex:1;background:none;border:0;padding:12px 0;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
nav button.on{color:var(--acc);font-weight:700}
#badge{position:absolute;top:4px;right:18%;background:#D9534F;color:#fff;border-radius:10px;font-size:9px;padding:1px 5px;display:none}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:14px;margin-top:8px}
.btn.red{background:#D9534F}.btn.green{background:#28A745}.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.mask{position:fixed;inset:0;background:rgba(90,77,65,.4);display:none;justify-content:center;align-items:flex-end;z-index:200}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow-y:auto}
.sheet h2{font-size:18px;display:flex;justify-content:space-between;margin-bottom:14px}
.sheet h2 span{cursor:pointer;color:var(--sub)}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:#FAFAFA;color:var(--text)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tabs button{flex:1;min-width:30%;border:0;background:var(--bd);color:var(--sub);padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--bd);background:#fff;border-radius:6px;font-size:16px;cursor:pointer}
.tag{font-size:11px;background:var(--light);color:var(--sub);padding:2px 8px;border-radius:6px}
.price{color:#28A745;font-weight:700}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#5A4D41;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:999;display:none;max-width:90%}
.empty{text-align:center;color:#999;padding:28px}
</style>
</head>
<body>
<div class="wrap">
  <div class="box"><h1 id="title">韓國童裝連線代購</h1></div>
  <div class="box bar"><span id="who">👤 尚未登入</span><button class="btn sm" id="authBtn" data-act="authOpen">登入 / 註冊</button></div>

  <div id="s-home" class="sec on">
    <div class="pills" id="pills"></div>
    <div class="grid" id="list"></div>
  </div>
  <div id="s-cart" class="sec"><div id="cartBox"></div></div>
  <div id="s-member" class="sec"><div id="memberBox"></div></div>
</div>

<nav>
  <button class="on" data-act="nav" data-id="home">🏠<br>首頁</button>
  <button data-act="nav" data-id="cart">🛒<br>購物車<span id="badge">0</span></button>
  <button data-act="nav" data-id="member">👤<br>會員專區</button>
  <button data-act="adminOpen">🔐<br>管理者</button>
</nav>

<!-- 會員登入/註冊 -->
<div class="mask" id="m-auth"><div class="sheet">
  <h2><b id="authTitle">會員登入</b><span data-act="close" data-id="m-auth">✕</span></h2>
  <div id="regOnly" style="display:none"><label>全名 *</label><input id="aName"></div>
  <label>電話號碼（登入帳號）*</label><input id="aPhone" type="tel" placeholder="0912345678">
  <div id="regOnly2" style="display:none"><label>電子信箱 *</label><input id="aEmail" type="email"></div>
  <label>密碼 *（至少 6 碼）</label><input id="aPwd" type="password">
  <button class="btn big" id="authGo" data-act="authGo">登入</button>
  <p style="text-align:center;margin-top:14px;font-size:13px"><span id="authAsk">還沒有帳號？</span> <a href="#" data-act="authToggle" id="authSwitch" style="color:var(--acc);font-weight:700">點此註冊</a></p>
</div></div>

<!-- 商品詳情 -->
<div class="mask" id="m-prod"><div class="sheet">
  <h2><b>選擇尺寸與數量</b><span data-act="close" data-id="m-prod">✕</span></h2>
  <img id="dImg" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:var(--light)" alt="">
  <div style="margin:10px 0 4px"><span class="tag" id="dCat"></span></div>
  <div id="dName" style="font-size:18px;font-weight:700"></div>
  <div id="dNote" style="font-size:13px;color:#666;margin:6px 0"></div>
  <div id="dSizes"></div>
  <button class="btn big" data-act="addCart">🛒 放入購物車</button>
</div></div>

<!-- 管理者登入 -->
<div class="mask" id="m-alogin"><div class="sheet">
  <h2><b>管理者登入</b><span data-act="close" data-id="m-alogin">✕</span></h2>
  <label>管理者信箱</label><input id="adEmail" type="email">
  <label>密碼</label><input id="adPwd" type="password">
  <button class="btn big" data-act="adminLogin">登入後台</button>
</div></div>

<!-- 商品編輯 -->
<div class="mask" id="m-edit" style="z-index:300"><div class="sheet">
  <h2><b id="eTitle">商品資料</b><span data-act="close" data-id="m-edit">✕</span></h2>
  <label>款式名稱 *</label><input id="eName">
  <label>分類</label><select id="eCat"></select>
  <label>尺寸（逗號隔開）</label><input id="eUnits" value="90,100,110,120,130">
  <label>各尺寸韓幣買入價（依尺寸順序，逗號隔開，可留空）</label><input id="eKrw" placeholder="25000,25000,28000">
  <label>各尺寸售價 NT$（留空則依韓幣÷匯率自動計算）</label><input id="eNt" placeholder="650,650,720">
  <label>圖片（上傳至雲端儲存，≤5MB）</label><input type="file" id="eFile" accept="image/*">
  <input id="eImg" placeholder="或貼上圖片網址" style="margin-top:6px">
  <label>備註</label><input id="eNote">
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="eHide" style="width:20px"> 隱藏（暫不上架）</label>
  <button class="btn big" data-act="saveProd" id="eSave">儲存</button>
</div></div>

<!-- 管理後台 -->
<div class="mask" id="m-admin"><div class="sheet">
  <h2><b>🔐 童裝管理後台</b><span data-act="close" data-id="m-admin">✕</span></h2>
  <div class="tabs" id="tabs"></div>
  <div id="adminBody"></div>
</div></div>

<div id="toast"></div>

<script>
// ===== 設定：請改成你的管理者信箱（需與安全規則一致）=====
const ADMIN_EMAIL = "ADMIN_EMAIL";
const CATS = ["上衣/T恤","褲子/裙裝","外套/針織","配件/鞋帽"];

firebase.initializeApp({
  apiKey:"AIzaSyBHmyi3-dmv2Zcn8ULXwuIIODSWVdcDTdY",authDomain:"korea-buy-list.firebaseapp.com",
  projectId:"korea-buy-list",storageBucket:"korea-buy-list.firebasestorage.app",
  messagingSenderId:"131856493166",appId:"1:131856493166:web:1f4a1c108ffbfdb89a547f"
});
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'NT$ '+(Number(n)||0).toLocaleString();
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};

let products=[], orders=[], users=[], settings={title:'韓國童裝連線代購',rate:41.5};
let me=null, profile=null, isAdmin=false, regMode=false, filter='全部';
let cart=load('kids_cart',[]), modalQty={}, curPid=null, editId=null, tab='prod';
let unsubOrders=null, unsubUsers=null;

const priceOf=(p,u)=>{const i=(p.prices||{})[u]||{};const nt=parseInt(i.nt);if(nt>0)return nt;const k=parseInt(i.krw);return k>0?Math.round(k/(settings.rate||41.5)):0};
const krwOf=(p,u)=>parseInt(((p.prices||{})[u]||{}).krw)||0;
const ph='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%238C705F" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

// ===== 即時資料 =====
db.collection('settings').doc('site').onSnapshot(d=>{
  if(d.exists)settings={...settings,...d.data()};
  $('title').textContent=settings.title;document.title=settings.title;renderAll();
});
db.collection('products').orderBy('createdAt','desc').onSnapshot(s=>{
  products=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();
},e=>console.error(e));

auth.onAuthStateChanged(async u=>{
  me=u;profile=null;isAdmin=!!u&&u.email===ADMIN_EMAIL;
  unsubOrders&&unsubOrders();unsubUsers&&unsubUsers();orders=[];users=[];
  if(u&&!isAdmin){
    const d=await db.collection('userProfiles').doc(u.uid).get();
    profile=d.exists?d.data():{name:u.displayName||'會員',phone:u.email.split('@')[0],email:''};
  }
  if(u){
    const q=isAdmin?db.collection('orders'):db.collection('orders').where('uid','==',u.uid);
    unsubOrders=q.onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAtMs-a.createdAtMs);renderAll()},e=>console.error(e));
    if(isAdmin)unsubUsers=db.collection('userProfiles').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin()});
  }
  $('who').innerHTML=isAdmin?'🔐 管理者模式':profile?'👤 <b>'+esc(profile.name)+'</b> ('+esc(profile.phone)+')':'👤 尚未登入';
  $('authBtn').textContent=u?'登出':'登入 / 註冊';
  $('authBtn').dataset.act=u?'logout':'authOpen';
  renderAll();
});

// ===== 渲染 =====
function renderAll(){renderPills();renderList();renderCart();renderMember();if($('m-admin').classList.contains('on'))renderAdmin()}
function renderPills(){
  $('pills').innerHTML=['全部',...CATS].map(c=>`<button class="pill ${c===filter?'on':''}" data-act="filter" data-id="${esc(c)}">${esc(c)}</button>`).join('');
}
function priceRange(p){
  const v=(p.units||[]).map(u=>priceOf(p,u)).filter(x=>x>0);
  if(!v.length)return '';
  const a=Math.min(...v),b=Math.max(...v);return a===b?money(a):money(a)+' 起';
}
function renderList(){
  const list=products.filter(p=>!p.hidden&&(filter==='全部'||p.category===filter));
  $('list').innerHTML=list.length?list.map(p=>`<div class="item" data-act="open" data-id="${p.id}"><img src="${esc(p.image||ph)}" alt="" loading="lazy"><div>${esc(p.name)}<small>${esc(p.category)}</small><small class="price">${priceRange(p)}</small></div></div>`).join(''):'<div class="empty" style="grid-column:1/3">目前沒有商品</div>';
}
function cartCount(){return cart.reduce((s,c)=>s+c.count,0)}
function saveCart(){localStorage.setItem('kids_cart',JSON.stringify(cart));const b=$('badge');b.textContent=cartCount();b.style.display=cart.length?'block':'none'}
function renderCart(){
  saveCart();
  if(!cart.length){$('cartBox').innerHTML='<div class="empty">購物車是空的，去挑選童裝吧！</div>';return}
  let total=0;
  const rows=cart.map((c,i)=>{
    const p=products.find(x=>x.id===c.pid);if(!p)return '';
    const sub=priceOf(p,c.unit)*c.count;total+=sub;
    return `<div class="box"><div class="row"><b>👕 ${esc(p.name)}</b><button class="btn red sm" data-act="rmCart" data-id="${i}">移除</button></div><div class="row"><span>尺寸 ${esc(c.unit)} × ${c.count} 件</span><span class="price">${money(sub)}</span></div></div>`;
  }).join('');
  $('cartBox').innerHTML=rows+`<div class="row" style="font-size:16px;font-weight:700"><span>合計</span><span class="price">${money(total)}</span></div><button class="btn big" data-act="submitOrder">📦 確認送出訂單</button>`;
}
function orderCard(o,adm){
  const it=o.items.map(i=>`<div class="row"><span>• ${esc(i.name)}（${esc(i.unit)}）× ${i.count}</span><span>${money(i.nt*i.count)}</span></div>`).join('');
  const done=o.status==='done';
  const btns=adm?`<div class="row" style="justify-content:flex-end">${done?`<button class="btn sm" data-act="restore" data-id="${o.id}">↩️ 恢復</button>`:`<button class="btn green sm" data-act="complete" data-id="${o.id}">✅ 完成</button>`}<button class="btn red sm" data-act="delOrder" data-id="${o.id}">🗑️ 刪除</button></div>`:'';
  return `<div class="box" ${done?'style="background:var(--light)"':''}><div class="row"><b>📦 ${esc(o.id.slice(-6).toUpperCase())}${adm?' · '+esc(o.name)+'（'+esc(o.phone)+'）':''}</b><span style="color:${done?'#28A745':'#D9534F'}">${done?'已完成':'處理中'}</span></div><div style="font-size:11px;color:#999">${new Date(o.createdAtMs).toLocaleString()}</div>${it}<div class="row"><b>合計</b><b class="price">${money(o.total)}</b></div>${btns}</div>`;
}
function renderMember(){
  if(!me||isAdmin){$('memberBox').innerHTML='<div class="empty">請先以會員身分登入，查看資料與訂單</div>';return}
  const mine=orders;
  $('memberBox').innerHTML=`<div class="box"><div class="row"><b>👤 ${esc(profile?.name)}</b><button class="btn sm" data-act="editProfile">✏️ 編輯</button></div><div class="row"><span>📱 ${esc(profile?.phone)}</span></div><div class="row"><span>✉️ ${esc(profile?.email||'未設定')}</span></div></div><b style="font-size:15px">📦 我的訂單</b><div style="margin-top:8px">${mine.length?mine.map(o=>orderCard(o,false)).join(''):'<div class="empty">目前沒有訂單</div>'}</div>`;
}

// ===== 後台 =====
const TABS=[['prod','👕 商品'],['pend','📋 待處理'],['done','🎉 已完成'],['user','👥 會員'],['set','⚙️ 設定']];
function renderAdmin(){
  $('tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('');
  const b=$('adminBody');
  if(tab==='prod'){
    b.innerHTML=`<button class="btn big" style="margin:0 0 10px" data-act="newProd">➕ 新增款式</button>`+products.map(p=>`<div class="box"><div class="row"><b>${esc(p.name)}${p.hidden?'（已隱藏）':''}</b></div><div class="row"><span>${esc(p.category)} | [${esc((p.units||[]).join(','))}]</span><span><button class="btn sm" data-act="editProd" data-id="${p.id}">編輯</button> <button class="btn red sm" data-act="delProd" data-id="${p.id}">刪除</button></span></div></div>`).join('');
  }else if(tab==='pend'||tab==='done'){
    const list=orders.filter(o=>(o.status==='done')===(tab==='done'));
    let head='';
    if(tab==='done'){
      let rev=0,cost=0;list.forEach(o=>o.items.forEach(i=>{rev+=i.nt*i.count;cost+=(i.krw>0?Math.round(i.krw/(i.rate||settings.rate)):0)*i.count}));
      head=`<div class="box"><div class="row"><span>營收</span><b class="price">${money(rev)}</b></div><div class="row"><span>成本（韓幣換算）</span><b>${money(cost)}</b></div><div class="row"><span>預估毛利</span><b class="price">${money(rev-cost)}</b></div></div>`;
    }
    b.innerHTML=head+(list.length?list.map(o=>orderCard(o,true)).join(''):'<div class="empty">沒有訂單</div>')+(tab==='done'?'':'');
  }else if(tab==='user'){
    b.innerHTML=`<b>註冊會員：${users.length} 位</b>`+users.map(u=>`<div class="box"><div class="row"><b>${esc(u.name)}</b><span>${esc(u.phone)}</span></div><div class="row"><span>✉️ ${esc(u.email)}</span><span>訂單 ${orders.filter(o=>o.uid===u.id).length} 筆</span></div></div>`).join('');
  }else{
    b.innerHTML=`<label>網頁標題</label><input id="sTitle" value="${esc(settings.title)}"><label>預設匯率（1 台幣 = ? 韓幣）</label><input id="sRate" type="number" step="0.1" value="${settings.rate}"><button class="btn big" data-act="saveSettings">儲存設定</button><button class="btn big" style="background:#5A4D41" data-act="exportCsv">📥 匯出訂單 CSV</button>`;
  }
}

// ===== 動作 =====
const ACT={
  nav(id,_,t){
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));t.classList.add('on');
  },
  close(id){$(id).classList.remove('on')},
  filter(id){filter=id;renderPills();renderList()},
  open(id){
    const p=products.find(x=>x.id===id);if(!p)return;curPid=id;modalQty={};
    $('dImg').src=p.image||ph;$('dCat').textContent=p.category;$('dName').textContent=p.name;
    $('dNote').textContent=p.note||'';$('dNote').style.display=p.note?'block':'none';
    $('dSizes').innerHTML=(p.units||[]).map(u=>`<div class="box row" style="margin:6px 0"><span><b>尺寸 ${esc(u)}</b> <span class="price">${priceOf(p,u)?money(priceOf(p,u)):'洽詢'}</span></span><span class="qty"><button data-act="qty" data-u="${esc(u)}" data-d="-1">-</button><b id="q_${esc(u)}">0</b><button data-act="qty" data-u="${esc(u)}" data-d="1">+</button></span></div>`).join('');
    $('m-prod').classList.add('on');
  },
  qty(_,u,t){
    const n=Math.max(0,(modalQty[u]||0)+Number(t.dataset.d));
    n?modalQty[u]=n:delete modalQty[u];
    const el=document.getElementById('q_'+u);if(el)el.textContent=n;
  },
  addCart(){
    if(!me||isAdmin){toast('請先以會員身分登入');return ACT.authOpen()}
    const us=Object.keys(modalQty);if(!us.length)return toast('請至少選擇一個尺寸');
    us.forEach(u=>{const ex=cart.find(c=>c.pid===curPid&&c.unit===u);ex?ex.count+=modalQty[u]:cart.push({pid:curPid,unit:u,count:modalQty[u]})});
    renderCart();ACT.close('m-prod');toast('🛒 已放入購物車');
  },
  rmCart(i){cart.splice(+i,1);renderCart()},
  async submitOrder(){
    if(!me||isAdmin)return ACT.authOpen();
    const items=[];let total=0;
    for(const c of cart){const p=products.find(x=>x.id===c.pid);if(!p)continue;
      const nt=priceOf(p,c.unit);total+=nt*c.count;
      items.push({pid:p.id,name:p.name,unit:c.unit,count:c.count,nt,krw:krwOf(p,c.unit),rate:settings.rate})}
    if(!items.length)return toast('購物車沒有有效商品');
    try{
      await db.collection('orders').add({uid:me.uid,name:profile.name,phone:profile.phone,items,total,status:'pending',createdAtMs:Date.now(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      cart=[];renderCart();toast('🎉 訂單已送出！');
      ACT.nav('member',null,document.querySelectorAll('nav button')[2]);
    }catch(e){toast('送出失敗：'+e.message)}
  },
  // 會員驗證
  authOpen(){regMode=false;authUI();$('m-auth').classList.add('on')},
  authToggle(){regMode=!regMode;authUI()},
  async authGo(){
    const phone=$('aPhone').value.replace(/\D/g,''),pwd=$('aPwd').value;
    if(!phone||!pwd)return toast('請填寫電話與密碼');
    const mail=phone+'@koreabuy.app';
    try{
      if(regMode){
        const name=$('aName').value.trim(),email=$('aEmail').value.trim();
        if(!name||!email)return toast('請完整填寫全名與信箱');
        const r=await auth.createUserWithEmailAndPassword(mail,pwd);
        await db.collection('userProfiles').doc(r.user.uid).set({name,phone,email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        profile={name,phone,email};$('who').innerHTML='👤 <b>'+esc(name)+'</b> ('+esc(phone)+')';renderMember();
        toast('🎉 註冊成功');
      }else{await auth.signInWithEmailAndPassword(mail,pwd);toast('✅ 登入成功')}
      ACT.close('m-auth');
    }catch(e){toast(regMode?'註冊失敗：'+e.message:'登入失敗：電話或密碼錯誤')}
  },
  logout(){auth.signOut();toast('已登出')},
  async editProfile(){
    const name=prompt('全名',profile.name);if(!name)return;
    const email=prompt('電子信箱',profile.email||'');if(!email)return;
    await db.collection('userProfiles').doc(me.uid).set({name:name.trim(),email:email.trim()},{merge:true});
    profile={...profile,name:name.trim(),email:email.trim()};renderMember();toast('✅ 已更新');
  },
  // 管理者
  adminOpen(){
    if(isAdmin){$('m-admin').classList.add('on');renderAdmin()}
    else $('m-alogin').classList.add('on');
  },
  async adminLogin(){
    try{
      const r=await auth.signInWithEmailAndPassword($('adEmail').value.trim(),$('adPwd').value);
      if(r.user.email!==ADMIN_EMAIL){await auth.signOut();return toast('此帳號不是管理者')}
      ACT.close('m-alogin');isAdmin=true;setTimeout(()=>ACT.adminOpen(),400);
    }catch(e){toast('登入失敗')}
  },
  tab(id){tab=id;renderAdmin()},
  newProd(){editId=null;fillEdit({})},
  editProd(id){editId=id;fillEdit(products.find(p=>p.id===id))},
  async saveProd(){
    const name=$('eName').value.trim();if(!name)return toast('請填寫款式名稱');
    const units=$('eUnits').value.split(',').map(s=>s.trim()).filter(Boolean);
    const krws=$('eKrw').value.split(','),nts=$('eNt').value.split(',');
    const prices={};units.forEach((u,i)=>prices[u]={krw:(krws[i]||'').trim(),nt:(nts[i]||'').trim()});
    let image=$('eImg').value.trim();
    const f=$('eFile').files[0];
    try{
      if(f){
        if(f.size>5*1024*1024)return toast('圖片不能超過 5MB');
        toast('圖片上傳中…');
        const ref=storage.ref('products/'+Date.now()+'_'+f.name.replace(/[^\w.]/g,''));
        await ref.put(f);image=await ref.getDownloadURL();
      }
      const data={name,category:$('eCat').value,units,prices,note:$('eNote').value.trim(),image,hidden:$('eHide').checked};
      if(editId)await db.collection('products').doc(editId).update(data);
      else await db.collection('products').add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      ACT.close('m-edit');toast('✅ 已儲存');
    }catch(e){toast('儲存失敗：'+e.message)}
  },
  async delProd(id){if(confirm('確定刪除此款式？'))await db.collection('products').doc(id).delete()},
  async complete(id){if(confirm('標記為已完成？'))await db.collection('orders').doc(id).update({status:'done',doneAtMs:Date.now()})},
  async restore(id){await db.collection('orders').doc(id).update({status:'pending'})},
  async delOrder(id){if(confirm('確定刪除此訂單？'))await db.collection('orders').doc(id).delete()},
  async saveSettings(){
    const rate=parseFloat($('sRate').value),title=$('sTitle').value.trim();
    if(!(rate>0)||!title)return toast('請輸入有效標題與匯率');
    await db.collection('settings').doc('site').set({title,rate},{merge:true});toast('✅ 設定已更新');
  },
  exportCsv(){
    let csv="\uFEFF訂單編號,買家,電話,狀態,款式,尺寸,數量,韓幣,匯率,售價NT$,小計\n";
    orders.forEach(o=>o.items.forEach(i=>{csv+=[o.id.slice(-6).toUpperCase(),o.name,o.phone,o.status==='done'?'已完成':'處理中',i.name,i.unit,i.count,i.krw,i.rate,i.nt,i.nt*i.count].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')+"\n"}));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='訂單_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  }
};
function authUI(){
  $('authTitle').textContent=regMode?'註冊新會員':'會員登入';
  $('regOnly').style.display=$('regOnly2').style.display=regMode?'block':'none';
  $('authGo').textContent=regMode?'確認註冊':'登入';
  $('authAsk').textContent=regMode?'已經有帳號？':'還沒有帳號？';
  $('authSwitch').textContent=regMode?'點此登入':'點此註冊';
}
function fillEdit(p){
  $('eCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
  $('eTitle').textContent=editId?'編輯款式':'新增款式';
  $('eName').value=p.name||'';$('eCat').value=p.category||CATS[0];
  const units=p.units||['90','100','110','120','130'];
  $('eUnits').value=units.join(',');
  $('eKrw').value=units.map(u=>((p.prices||{})[u]||{}).krw||'').join(',');
  $('eNt').value=units.map(u=>((p.prices||{})[u]||{}).nt||'').join(',');
  $('eImg').value=p.image||'';$('eFile').value='';$('eNote').value=p.note||'';$('eHide').checked=!!p.hidden;
  $('m-edit').classList.add('on');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName==='A')e.preventDefault();
  const f=ACT[t.dataset.act];if(f)f(t.dataset.id,t.dataset.u,t);
});
saveCart();
</script>
</body>
</html>
